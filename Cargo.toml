[build-dependencies]
# NOTE: embed-resource is not currently wired up by build.rs (ships
# without embedded Windows resources). Kept here for when we do.
embed-resource = "3"
# V79: cbindgen generates include/ai_assistant.h from src/ffi.rs when
# building with --features ffi. Non-optional so build.rs doesn't need
# conditional compilation voodoo; the actual cbindgen invocation is gated
# inside build.rs on `env::var("CARGO_FEATURE_FFI").is_ok()`.
cbindgen = "0.27"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "core_benchmarks"
harness = false

[[bench]]
name = "vision_benchmarks"
harness = false
required-features = ["vision"]

# === Dev / test profiles ===
# Defaults explode on Windows for a crate this size: full debug info
# generates multi-GB PDBs (hits MSVC's LNK1318 PDB-stream limit on
# linking the full-feature lib) and incremental sessions can pile up
# to hundreds of GB across many rebuilds. `line-tables-only` keeps
# file:line in backtraces — the only debug info we actually use day
# to day — while cutting PDB size ~5x.
[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.test]
debug = "line-tables-only"
incremental = true

# === Release profile optimizations ===
[profile.release]
# Enable Link-Time Optimization for better dead code elimination
lto = true
# Single codegen unit for maximum optimization
codegen-units = 1
# Optimize for size with good performance
opt-level = "z"
# Strip symbols from binary
strip = true
# Unwind on panic. Slightly larger (landing pads + unwinding tables) but
# REQUIRED for correctness/security: `std::panic::catch_unwind` is a no-op under
# `panic = "abort"`, which would silently defeat the GuardrailPipeline's
# fail-closed-on-panicking-guard protection and turn every latent panic into a
# hard process crash with no per-operation recovery. (The hardened
# `release-protected` profile keeps `abort` on purpose — less string leakage.)
panic = "unwind"

[profile.release-fast]
inherits = "release"
# Optimize for speed instead of size
opt-level = 3
# Keep panic unwinding for better debugging
panic = "unwind"

# Criterion benches require panic = "unwind" because the harness catches
# panics across iterations. Inheriting from release would break with
# panic = "abort"; inherit from release-fast (opt-level 3 + unwind) so
# bench numbers remain representative of optimized release-fast code.
[profile.bench]
inherits = "release-fast"

# === Protected release profile (anti-reverse engineering) ===
[profile.release-protected]
inherits = "release"
# Fat LTO for maximum optimization and code merging (harder to analyze)
lto = "fat"
# Single codegen unit merges all code (harder to identify module boundaries)
codegen-units = 1
# Size optimization also obscures code patterns
opt-level = "z"
# Strip all symbols and debug info
strip = "symbols"
# No panic messages or unwinding (less string leakage)
panic = "abort"
# Overflow checks disabled in release (smaller, faster)
overflow-checks = false

# Metadata for downstream crates and build scripts
[package.metadata.protected-build]
# Post-build steps for maximum protection
upx_enabled = true
upx_flags = ["--best", "--lzma"]
sign_binary = true
verify_at_startup = true
