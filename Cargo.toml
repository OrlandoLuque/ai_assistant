[package]
name = "ai_assistant"
version = "0.2.216"
edition = "2021"
authors = ["Orlando Jose Luque Moraira (Lander)"]
description = "Reusable AI assistant library for local LLM integration (Ollama, LM Studio, etc.)"
license-file = "LICENSE"
repository = "https://github.com/OrlandoLuque/ai_assistant"
homepage = "https://ai-assistant.runawaybrains.com/"
documentation = "https://docs.rs/ai_assistant"
readme = "README.md"
keywords = ["ai", "llm", "assistant", "rag", "agent"]
categories = ["science", "text-processing", "web-programming"]
exclude = [
    "docs/*.md",
    "docs/backups/",
    ".claude/",
    ".run/",
    "target/",
    "PROMPT_MEJORAS.md",
    "prompt_safe_creative.md",
    "*.zip",
    "*.docx",
    "*.py",
    "*.tmp",
    "*.bak",
    "*.bak2",
    "src/*.tmp",
    "src/*.bak",
    "src/*.bak2",
    "src/*.py",
    "src/*.txt",
    "src/_*",
    "CLAUDE.md",
    "PENDING.md",
]

# V79: expose rlib (for the 20 binaries), cdylib (.so/.dylib/.dll for FFI
# consumers like Unity/Unreal/Bevy/C# P/Invoke), and staticlib (.a/.lib
# for engines that prefer static linking, e.g. Unreal). The cdylib and
# staticlib outputs are essentially empty unless --features ffi is on.
[lib]
crate-type = ["rlib", "cdylib", "staticlib"]
# Skip the libtest harness during `cargo bench`. Without this, cargo
# also tries to run the lib as a benchmark target; libtest does not
# accept `--output-format bencher` and aborts the whole job before
# our criterion benches under benches/*.rs ever run.
bench = false

[features]
# Default: full functionality (code has interdependencies)
# Use specific features for minimal builds after refactoring dependencies
default = ["full"]

# === Optional Feature Groups ===
# NOTE (V76 feature hygiene): the former `core = []` marker was removed. Core
# modules are always compiled when the library is included — no flag needed.

# Multi-agent system: orchestration, shared memory, task decomposition
multi-agent = []

# Security features: guardrails, PII detection, content moderation, access control
# V78: pulls sha2 so ai_proxy's gateway audit log can hash API keys.
security = ["dep:sha2"]

# Analytics: metrics, telemetry, engagement tracking, conversation analytics
analytics = []

# Vision/Multimodal support
vision = []

# Local embeddings and vector database
embeddings = []

# Advanced streaming: SSE, WebSocket, compression
advanced-streaming = []

# External API adapters: OpenAI, Anthropic, HuggingFace.
# NOTE (V76): marker feature retained — it is used as a label by the
# `adapters_demo` example (see [[example]] section). No cfg gates in src/.
adapters = []

# Tool calling: MCP protocol, agentic loops, function calling
tools = []

# Document parsing: EPUB, DOCX, HTML, PDF, feeds, tables
# NOTE: references the `pdf-extract` FEATURE (not `dep:pdf-extract`) so the
# cfg(feature = "pdf-extract") gates in document_parsing/parser.rs light up.
# With `dep:` only, the crate compiled but PDF parsing returned an error.
documents = ["dep:zip", "pdf-extract"]

# Evaluation and benchmarking: fine-tuning, metrics, A/B testing
eval = []

# Distributed computing: DHT, CRDTs, MapReduce (with parallel execution via rayon)
distributed = ["rayon"]

# Peer-to-peer networking: DHT discovery, NAT traversal, knowledge sharing
# Requires distributed for DHT support
p2p = ["distributed"]

# Real distributed networking: QUIC transport, consistent hashing, failure detection,
# Merkle sync, node security (mutual TLS), replication, LAN discovery.
# Not in 'full' by default due to heavy deps (quinn/rustls). Opt-in: --features distributed-network
distributed-network = ["distributed", "dep:quinn", "dep:rustls", "dep:rcgen", "dep:sha2", "dep:tokio", "dep:bincode", "dep:getrandom"]

# GPU sharing: distributed LLM inference network (provider, gateway, or both).
# Not in 'full' by default — requires distributed-network. Opt-in: --features gpu-sharing
gpu-sharing = ["distributed-network"]

# TLS support for the embedded HTTP server (HTTPS via rustls).
# Not in 'full' — opt-in only. Requires PEM cert/key files.
server-tls = ["dep:rustls", "dep:rustls-pemfile"]

# RAG with SQLite FTS5 and encrypted knowledge packages
# NOTE: references the `aes-gcm` FEATURE (not `dep:aes-gcm`) so that the
# cfg(feature = "aes-gcm") gates in content_encryption.rs light up. With
# `dep:` only, the crate compiled but AES-256-GCM returned EncryptionFailed.
rag = ["rusqlite", "aes-gcm"]

# Research: academic search APIs (arXiv, Semantic Scholar, PubMed), BibTeX, literature review
research = []

# egui widgets for chat UI
egui-widgets = ["egui"]

# V102: GGUF weight auto-downloader (resume, progress, SHA256, HF token).
# Generic — usable by any local provider that loads GGUF (llama.cpp,
# LM Studio, Kobold.cpp, LocalAI, text-gen-webui). For Ollama, the
# module also exposes a Modelfile helper.
auto-download = ["dep:sha2"]

# Full feature set (includes everything except egui)
full = [
    "multi-agent",
    "security",
    "analytics",
    "vision",
    "embeddings",
    "advanced-streaming",
    "adapters",
    "tools",
    "documents",
    "eval",
    "rag",
    "distributed",
    "binary-storage",
    "async-runtime",
    "advanced-memory",
    "research",
    "auto-download",
    "backup",
    "gdpr",
    "models-dev-fetcher",
    "hardware-detection",
    "hardware-nvml",
    "model-recommender",
    # Butler = environment auto-detection (providers, hardware, project). It is
    # dep-free (`autonomous = []`) and completes the recommender stack already
    # in `full`. Without it the shipped CLIs' `scan` / `providers` commands —
    # the core "just works" onboarding — fail with "requires the butler
    # feature", so it belongs in the default/product build.
    "butler",
    # Self-correction = the `CorrectableTask` engine (V98-V100), the stuck
    # detector, the critique refiner, and `machine_fix`. Dep-free, and inert
    # until a detector or verifier is actually configured, so a `full` build
    # gains capability without gaining behaviour. It belongs here because an
    # agent that cannot check and fix its own work is not a product-grade
    # agent — and because keeping it out meant `ai_test_harness` would need it
    # as an extra `required-features`, which silently drops the harness from
    # CI's `--all-targets` clippy gate (the coverage hole fixed in V247).
    # V261: adding it put the subsystem under `-D warnings` for the first time
    # and immediately exposed a validator that approved everything.
    "self-correction",
]

# Binary storage: bincode + gzip for internal data (faster, smaller than JSON)
binary-storage = ["dep:bincode"]

# Async runtime: tokio + reqwest for async HTTP operations
async-runtime = ["dep:tokio", "dep:reqwest"]

# Models.dev / open-weights catalog fetcher: async HTTP download into
# the existing `models_dev::ModelRegistry`. Off by default — keeps the
# parser/cache (V137) usable without dragging in the async runtime.
# V138: turns the docstring "left to the caller" into a real client.
models-dev-fetcher = ["async-runtime", "dep:futures"]

# V139: host hardware probe (CPU, RAM, GPUs, OS). Foundation for V140
# (Butler recommender) so the recommender knows what fits in VRAM.
#
# Base feature is sysinfo-only (cross-platform, gratis). NVIDIA probe
# is opt-in via `hardware-nvml` because nvml-wrapper links to the
# proprietary driver and is meaningless without one installed. ROCm
# and Metal shell out to vendor CLIs (`rocm-smi` / `system_profiler`)
# so they need no extra Rust deps — the sub-feature is just a cfg gate.
hardware-detection = ["dep:sysinfo"]
hardware-nvml = ["hardware-detection", "dep:nvml-wrapper"]
hardware-rocm = ["hardware-detection"]
hardware-metal = ["hardware-detection"]

# V140: Model recommender. Pairs the V137 catalog with the V139 hardware
# probe to pick a sweet-spot variant for a given task. The LLM advisor is
# an optional `Option<&dyn LlmEnhancer>` argument, no extra feature gate —
# rule-based pipeline is always usable on its own.
model-recommender = ["hardware-detection"]

# LanceDB embedded vector database (Tier 2 — recommended upgrade from in-memory)
# Not in 'full' by default due to heavy deps. Opt-in: --features vector-lancedb
vector-lancedb = ["dep:lancedb", "dep:arrow-array", "dep:arrow-schema", "dep:tokio", "dep:futures"]

# Binary integrity verification at startup (no runtime penalty after startup)
integrity-check = []

# WASM support: real web-sys/js-sys implementations for WASM targets.
# Only meaningful when compiling to wasm32. On native targets, this feature is a no-op.
wasm = ["dep:web-sys", "dep:js-sys", "dep:wasm-bindgen", "dep:getrandom"]

# Autonomous agent: policy, sandbox, OS tools, autonomous loop, profiles, user interaction,
# task board, interactive commands, mode manager
autonomous = []

# Scheduler: cron-like task scheduling + event-driven triggers
scheduler = ["autonomous"]

# Butler: environment auto-detection and configuration
butler = ["autonomous"]

# Browser automation: Chrome DevTools Protocol
browser = ["autonomous"]

# Distributed agents: run agents across distributed nodes (DHT, CRDTs, MapReduce)
distributed-agents = ["autonomous", "distributed-network"]

# AWS Bedrock provider: SigV4 authentication for Bedrock runtime API
aws-bedrock = ["dep:hmac", "dep:sha2"]

# pgvector: PostgreSQL vector database backend
# Note: actual postgres connectivity is via ureq REST or user-supplied connection.
# The postgres crate is heavy; this feature enables the pgvector SQL generation and types.
vector-pgvector = []

# Code sandbox: isolated code execution for AI agents
code-sandbox = ["autonomous"]

# Cloud connectors: S3 and Google Drive storage integration
cloud-connectors = []

# Container execution: Docker-based sandboxed code execution and document generation
# Not in 'full' by default — requires Docker installed. Opt-in: --features containers
containers = ["dep:bollard", "dep:tokio", "dep:futures"]

# Audio/Speech: STT (speech-to-text) and TTS (text-to-speech) via cloud APIs
audio = []

# Home automation: Home Assistant REST API, MQTT (Zigbee2MQTT/Tasmota), OpenHAB, mDNS discovery
home-automation = []

# CoAP protocol for constrained IoT devices (industrial sensors, smart agriculture)
coap = []

# Precise token counting via tiktoken (OpenAI exact tokenizer). Adds ~4MB to binary.
# Without this, uses BPE-200 (±10-15% error) or heuristic (±15-20%).
precise-tokens = ["dep:tiktoken-rs"]

# Event-driven workflow engine with checkpointing, time-travel, breakpoints
# Not in 'full' by default — requires tokio for async event loop. Opt-in: --features workflows
workflows = ["dep:tokio"]

# DSPy-style prompt optimization: signatures, bootstrap few-shot, metric search, self-reflect
# Not in 'full' by default — involves LLM calls for optimization. Opt-in: --features prompt-signatures
prompt-signatures = []

# Composable prompt fragments: conditional prompt assembly (equivalent structural
# pattern to Claude Code's ~110 conditional strings, but extensible by the caller).
# Not in 'full' by default — opt-in. Use: --features prompt-fragments
prompt-fragments = []

# In-crate user-stall detection: ring buffer of repeated tool-call hashes +
# keyword emotion classification of the last user message. Fires a Stalled
# verdict and emits a `user_stall_events_total` counter + OTel span.
# Not in 'full' by default — opt-in. Use: --features stall-detection
stall-detection = ["autonomous", "audio", "analytics"]

# Ephemeral sub-agent spawning (Fork/Teammate/Explore pattern — structural
# equivalent to Claude Code's Task tool). In-crate declarative model +
# trait SubAgentRunner with an in-process default impl over AgentOrchestrator.
# Real process/worktree isolation stays a caller concern (host-level).
# Not in 'full' by default — opt-in. Use: --features sub-agents
sub-agents = ["multi-agent", "analytics"]

# LLM-assisted second-opinion wrapper over `StallHeuristic`. Wraps any stall
# detector with a pluggable verdict callback; the library calls into the
# caller-provided LLM at most once per configurable cooldown window. Zero
# new dependencies — the callback is a plain `Fn` supplied by the caller.
# Not in 'full' by default — opt-in. Use: --features stall-detection-llm
stall-detection-llm = ["stall-detection"]

# Agent-to-Agent protocol (Google A2A): agent cards, task lifecycle, JSON-RPC 2.0
# Not in 'full' by default — requires tokio for async server. Opt-in: --features a2a
a2a = ["dep:tokio"]

# Advanced memory: episodic, procedural, entity memory with consolidation
advanced-memory = []

# Real-time voice agents: bidirectional audio streaming, VAD, interruption handling
# Not in 'full' by default — requires tokio for async streams. Opt-in: --features voice-agent
voice-agent = ["dep:tokio", "audio"]

# Real audio I/O: microphone capture, speaker output, sample rate conversion, ring buffer
# Not in 'full' by default — heavy platform deps (WASAPI/ALSA/CoreAudio). Opt-in: --features audio-io
audio-io = ["dep:cpal", "dep:hound", "dep:rubato", "dep:ringbuf", "dep:eframe", "dep:global-hotkey", "egui-widgets", "audio", "voice-agent"]

# Virtual webcam: capture, video effects, virtual cam output, GUI
# Not in 'full' by default — heavy platform deps (MSMF/V4L2/AVFoundation). Opt-in: --features video-io
video-io = ["dep:nokhwa", "dep:eframe", "dep:global-hotkey", "dep:ringbuf", "egui-widgets"]

# Media generation: image (DALL-E, SD, Flux) and video (Runway, Sora) generation
# Not in 'full' by default — involves external API calls. Opt-in: --features media-generation
media-generation = []

# Distillation pipeline: trajectory collection, scoring, dataset building, data flywheel
# Not in 'full' by default — involves LLM calls and storage. Opt-in: --features distillation
distillation = []

# Constrained decoding: grammar-guided generation for local models (GBNF, JSON Schema)
# Not in 'full' by default — only useful with local providers. Opt-in: --features constrained-decoding
constrained-decoding = []

# V79: C FFI bindings (extern "C" + cbindgen-generated header). Enables
# src/ffi.rs which exposes 20 extern "C" functions for use from
# C/C++/C#/Unity/Unreal/Bevy. Zero-dep: all FFI types come from libc (already
# a direct dep). The blocking primitive is generate_sync; when `rag` is also
# enabled, the FFI dispatches to generate_sync_with_rag instead.
# Not in 'full' by default — opt-in via --features ffi.
ffi = []

# Human-in-the-Loop: tool approval gates, confidence escalation, corrections, policies
# Not in 'full' by default — adds workflow overhead. Opt-in: --features hitl
hitl = []

# WebRTC voice transport: real-time voice with SDP, ICE, RTP
# Not in 'full' by default — heavy networking. Opt-in: --features webrtc
webrtc = ["dep:tokio"]

# Agent DevTools: debugging, profiling, execution replay for agents
# Not in 'full' by default — development-only. Opt-in: --features devtools
devtools = []

# Diagnostic logging: compile-in debug/trace log calls throughout the library
# (prompts, contexts, RAG scores, graph traversals, memory retrieval, token budgets).
# Without this feature, all diagnostic log::debug!/trace! calls compile to NOTHING — zero overhead.
# Opt-in: --features diagnostic-logging
diagnostic-logging = ["dep:env_logger"]

# Chaos engineering / fault injection framework (testing only)
# Not in 'full' — strictly opt-in: --features chaos-testing
chaos-testing = []

# Evaluation benchmark suite: standard benchmarks (HumanEval, MMLU, etc.) with real LLM calls
# Not in 'full' by default — requires network access and LLM providers. Opt-in: --features eval-suite
eval-suite = ["eval"]

# Local Whisper STT: offline speech-to-text via whisper.cpp bindings
# Not in 'full' by default — heavy native C++ dep. Opt-in: --features whisper-local
whisper-local = ["dep:whisper-rs", "audio"]

# Desktop GUI application: eframe + egui widgets + file dialogs + Butler + RAG + graph viz
# Not in 'full' — brings windowing deps. Run: cargo run --bin ai_gui --features gui
gui = ["dep:eframe", "dep:rfd", "dep:petgraph", "egui-widgets", "rag", "butler"]

# Desktop GUI Pro: full library + all optional features wired into the GUI.
# Run: cargo run --bin ai_logs_gui --features gui-logs
gui-logs = ["dep:eframe", "distributed-network"]

# Recipes auditor GUI (Phase A.1) — visual audit of YAML recipes
# Run: cargo run --bin ai_recipes_gui --features gui-recipes
gui-recipes = ["dep:eframe"]

# Agent Client Protocol (ACP) server — JSON-RPC 2.0 over stdio.
# Lets editors (Zed, VS Code, JetBrains) drive ai_assistant as an embedded
# coding agent. Core protocol only; no extra deps. Run: cargo run --bin ai_acp.
acp = []

# ACP auditor GUI — visual audit of session SLO logs.
# Run: cargo run --bin ai_acp_audit_gui --features gui-acp
gui-acp = ["acp", "dep:eframe"]

# V262: visual auditor for the self-correction review queue — the CLI
# `ai_corrections` companion, promised by the module docs since V98.
gui-corrections = ["self-correction", "dep:eframe"]

# In-process local inference (V108 / Phase A.3) — base scaffolding only.
# Surfaces backend trait, config builder, VRAM detection, GPU-layer auto-clamp.
# Backend implementations live behind sub-features (local-inference-candle,
# local-inference-llama-cpp) so users opting in pay only for what they use.
local-inference = []

# Local-inference auditor GUI — visual audit of generation SLO logs.
# Run: cargo run --bin ai_local_infer_audit_gui --features gui-local-inference
gui-local-inference = ["local-inference", "dep:eframe"]

# Real Candle CPU backend (V110). Adds ~50 MB of native deps and ~10 min
# to a clean build, so it's strictly opt-in. No CUDA/Metal/Accelerate
# yet — those follow once the CPU baseline is verified end-to-end.
local-inference-candle = [
    "local-inference",
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
]

# In-process semantic embedder (candle BERT, e.g. all-MiniLM-L6-v2): semantic
# knowledge retrieval WITHOUT an Ollama/embedding server. Bundleable and
# mobile-friendly (~22M params). Falls back to lexical when the model files are
# absent. Opt-in — heavy candle deps.
embeddings-local = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
]

# Real llama-cpp-2 backend (V112). Native llama.cpp via bindgen — requires
# libclang at build time (LIBCLANG_PATH or LLVM\bin on PATH). Brings
# continuous batching (multi-agent in-process throughput on one GPU) and
# tensor-split (multi-GPU). CPU baseline only in this iteration; GPU build
# requires `cuda` / `metal` features on the upstream crate, deferred.
local-inference-llama-cpp = [
    "local-inference",
    "dep:llama-cpp-2",
    "dep:encoding_rs",
]

# Run: cargo run --bin ai_gui-pro --features gui-pro
gui-pro = [
    "gui", "full",
    "scheduler",
    "browser",
    "code-sandbox",
    "hitl",
    "devtools",
    "audio",
    "media-generation",
    "constrained-decoding",
    "prompt-signatures",
    "cloud-connectors",
    "integrity-check",
    "workflows",
]

# === Microservice Features (v30) ===

# axum-based HTTP server: production-ready async, HTTP/2, native WS/SSE, tower middleware
# Not in 'full' — opt-in. Replaces std::net::TcpListener server with axum framework.
server-axum = ["dep:axum", "dep:axum-extra", "dep:tower", "dep:tower-http", "dep:tokio", "dep:async-stream", "dep:futures-core", "dep:reqwest", "dep:toml", "dep:parking_lot", "dep:bytes"]

# axum TLS (HTTPS via rustls, separate from server-tls which is for the std server)
server-axum-tls = ["server-axum", "dep:axum-server", "dep:rustls", "dep:rustls-pemfile"]

# Server cluster mode: distributed state via CRDTs, CRDT sync, session affinity, health checks
# Wires existing distributed infrastructure (NetworkNode, CRDTs, DHT) into the axum server.
server-cluster = ["server-axum", "distributed-network"]

# OpenAPI/Swagger UI via utoipa: auto-generated API docs served at /swagger-ui
server-openapi = ["server-axum", "dep:utoipa", "dep:utoipa-swagger-ui"]

# Redis backend: alternative to CRDT sync for rate limiting, sessions, caching
redis-backend = ["dep:redis"]

# === V96: Self-Learning (Skill Forge + Fragment Synthesis + Feedback Loop) ===

# Skill Forge: LLM-authored skills with Declarative DSL + WASM-Rust execution.
# Hash-chained evidence ledger (Blake3) + Ed25519 signatures + capability sandbox.
# Not in 'full' — heavy deps (wasmtime). Opt-in: --features skill-forge
skill-forge = [
    "dep:wasmtime",
    "dep:wasmtime-wasi",
    "dep:ed25519-dalek",
    "dep:blake3",
    "dep:hkdf",
    "dep:sha2",
    "security",
]

# Prompt Synthesis: contextual bandit over fragment combinations, clustered by
# intent embedding. FragmentBandit + cluster manager + reward ledger.
# Not in 'full' — opt-in. Use: --features prompt-synthesis
prompt-synthesis = [
    "prompt-fragments",
    "embeddings",
    "dep:blake3",
    "advanced-memory",
]

# Feedback Loop: dispatcher routing trajectory+reward to memory, routing bandit,
# fragment bandit, skill forge, dataset writer. Hash-chained dispatch ledger.
# Not in 'full' — opt-in. Use: --features feedback-loop
feedback-loop = [
    "distillation",
    "advanced-memory",
    "dep:blake3",
    "dep:ed25519-dalek",
]

# === V97: PromptBreeder — Self-Referential Prompt Evolution ===

# Self-referential prompt evolution (Fernando et al. 2023, DeepMind) with 3
# additions vs paper: provider-fingerprint-isolated fitness, hash-chained
# Blake3 ledger + optional Ed25519, UCB bandit over operators.
# 19 configurable axes (seed source, eval augmenter, diversity metric,
# lineage narrator, fitness smoothing, scheduler, selection, crossover,
# replacement, fitness objective, budget, cache, checkpoint, safety,
# retry, output parser, operator set, max prompt tokens, rng seed).
# Not in 'full' — opt-in. Use: --features prompt-breeder
prompt-breeder = [
    "dep:blake3",
]

# === V98: Self-Correction Framework ===

# Generic validator-corrector harness (Reflexion pattern). Trait
# `CorrectableTask`, 4-dim budget engine (attempts/tokens/cost/time), JSONL
# ledger, auditor binaries. Ships `ClaimVerificationTask` wrapping CoVe +
# faithfulness + quality gates. Not in 'full' — opt-in. Use:
# --features self-correction
self-correction = []

# V128 (C.7): explicit feature stubs for optional deps that other code
# gates on directly via `#[cfg(feature = "<name>")]`. Cargo used to
# create these implicit features for each optional dependency name;
# adding explicit `dep:<name>` references elsewhere (e.g. in the new
# `backup` feature below) disables the implicits, so we keep the
# names alive as explicit stubs. No behavioural change.
aes-gcm = ["dep:aes-gcm"]
zip = ["dep:zip"]
pdf-extract = ["dep:pdf-extract"]

# === V128 (C.7): backup / restore ===
#
# AES-256-GCM-encrypted, Ed25519-signed, content-addressable archive
# of arbitrary source paths. Ships the `ai_backup` CLI binary and the
# `backup::{create,verify,restore}_backup` library API. Opt-in to
# avoid pulling crypto deps for users who only need providers.
backup = [
    "dep:zip",
    # FEATURE not dep: so cfg(feature = "aes-gcm") gates in
    # content_encryption.rs light up under backup-only builds too
    # (same V152 drift class the lint now guards — caught here in V154).
    "aes-gcm",
    "dep:sha2",
    "dep:ed25519-dalek",
    "dep:hkdf",
]

# === V129 (C.8): GDPR right-to-erasure ===
#
# Article 17 of the EU GDPR ("Right to be Forgotten"). Surfaces a
# `gdpr::purge_user` orchestrator + `PurgeAdapter` trait so a single
# call can walk every subsystem that stores user-attributable data,
# emit a tamper-evident audit record, and redact the data subject's
# user_id in the central audit log instead of erasing the audit
# trail itself (regulatory dual obligation: erase the data subject's
# data, but keep proof the request was honoured).
#
# Pulls only `sha2` so audit records can carry a SHA-256 hash of the
# erased user_id rather than the raw value. No other dep cost.
gdpr = ["dep:sha2"]

[dependencies]
anyhow = "1"
# V113: thiserror for derive-based error enums with stable codes. Macro-only,
# zero runtime overhead. Always-on so the `error_taxonomy` module compiles
# in the default feature set.
thiserror = "2"
log = "0.4"
env_logger = { version = "0.11", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
flate2 = "1"
regex = "1"
urlencoding = "2"

# Optional ZIP support for document parsing (EPUB, DOCX, ODT)
zip = { version = "2", optional = true, default-features = false, features = ["deflate"] }

# Optional PDF support for document parsing
pdf-extract = { version = "0.7", optional = true }

# Optional egui support for widgets
egui = { version = "0.27", optional = true }
# Optional SQLite for RAG storage
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
# Optional AES-GCM for encrypted knowledge packages
aes-gcm = { version = "0.10", optional = true }
# Optional bincode for binary internal storage (faster than JSON)
bincode = { version = "1", optional = true }
# Optional async runtime for async HTTP operations
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"], optional = true }
# Optional reqwest for async HTTP client (also supports blocking)
reqwest = { version = "0.12", features = ["json", "blocking", "stream"], optional = true }
# Optional rayon for parallel MapReduce execution
rayon = { version = "1", optional = true }
# Optional QUIC transport for distributed networking
quinn = { version = "0.11", optional = true }
# Optional TLS for distributed networking (required by quinn) and server-tls
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
# Optional PEM certificate/key loading for server-tls
rustls-pemfile = { version = "2", optional = true }
# Optional certificate generation for node identity
rcgen = { version = "0.13", optional = true }
# Optional SHA-256 for Merkle tree hashing
sha2 = { version = "0.10", optional = true }
# Optional tiktoken for exact OpenAI tokenizer (cl100k_base, o200k_base). Adds ~4MB.
tiktoken-rs = { version = "0.6", optional = true }
# Optional LanceDB for embedded vector database (Tier 2)
lancedb = { version = "0.26", optional = true, default-features = false }
# Optional Arrow for LanceDB data interchange (version must match lancedb's arrow dep)
arrow-array = { version = "57", optional = true }
arrow-schema = { version = "57", optional = true }
# Optional futures for async stream collection (LanceDB queries)
futures = { version = "0.3", optional = true }
# Optional HMAC for AWS SigV4 authentication (Bedrock, S3)
hmac = { version = "0.12", optional = true }
# Optional WASM support via web-sys/js-sys (only useful on wasm32 targets)
web-sys = { version = "0.3", features = ["console", "Window"], optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }
# Optional Docker API client for container-based execution
bollard = { version = "0.18", optional = true, default-features = false, features = ["ssl", "time"] }
# Optional whisper.cpp bindings for local STT (heavy native dep, links to C++)
whisper-rs = { version = "0.15", optional = true }
# Optional audio I/O for real-time microphone/speaker access (platform: WASAPI/ALSA/CoreAudio)
cpal = { version = "0.15", optional = true }
# Optional WAV file read/write
hound = { version = "3.5", optional = true }
# Optional high-quality sample rate conversion
rubato = { version = "0.16", optional = true }
# Optional lock-free ring buffer for real-time audio threads
ringbuf = { version = "0.4", optional = true }
# Optional global-hotkey for PTT (EAC-safe: uses RegisterHotKey, no input hooking)
global-hotkey = { version = "0.6", optional = true }
# Optional eframe for GUI application (desktop window with egui)
eframe = { version = "0.27", optional = true, default-features = false, features = ["default_fonts", "glow"] }
# Optional native file dialog (open/save file pickers)
rfd = { version = "0.15", optional = true }
# Optional webcam capture (cross-platform: MSMF/V4L2/AVFoundation)
nokhwa = { version = "0.10", optional = true, default-features = false, features = ["input-msmf"] }
# Optional graph data structure and algorithms (for knowledge graph visualization)
petgraph = { version = "0.6", optional = true }

# === Microservice dependencies (v30) ===
# axum web framework (production-ready async HTTP server)
axum = { version = "0.8", optional = true, features = ["ws", "json", "macros"] }
# axum extra utilities (typed headers, cookie support)
axum-extra = { version = "0.12", optional = true, features = ["typed-header"] }
# Tower service abstraction (middleware composition)
tower = { version = "0.5", optional = true, features = ["full"] }
# Tower HTTP middleware (CORS, compression, request ID, rate limiting, body limits)
tower-http = { version = "0.6", optional = true, features = ["cors", "compression-gzip", "limit", "request-id", "trace", "timeout"] }
# DashMap concurrent HashMap (lock-free per-shard access for sessions, rate limits)
dashmap = { version = "6" }
# V78: TOML config parsing for ai_proxy (already transitive via other crates).
toml = { version = "0.9", optional = true }
# V78: parking_lot::Mutex for ai_proxy cache / guardrail pipeline (already transitive).
parking_lot = { version = "0.12", optional = true }
# axum TLS server (HTTPS via rustls)
axum-server = { version = "0.8", optional = true, features = ["tls-rustls"] }
# OpenAPI documentation generation from code annotations
utoipa = { version = "5", optional = true, features = ["axum_extras"] }
# Swagger UI for interactive API documentation
utoipa-swagger-ui = { version = "9", optional = true, features = ["axum"] }
# Redis client (async with tokio, connection pooling)
redis = { version = "1", optional = true, features = ["tokio-comp", "connection-manager"] }
# Async stream combinators for SSE responses
async-stream = { version = "0.3", optional = true }
# Futures core traits (Stream trait for SSE)
futures-core = { version = "0.3", optional = true }
# Byte buffer type used by reqwest::Response::bytes_stream and
# axum::body::Body::from_stream. Already a transitive dep; declared
# explicitly so V150 streaming code can name `bytes::Bytes`.
bytes = { version = "1", optional = true }

# === V96: Self-Learning deps ===
# Wasmtime runtime for Skill Forge WASM execution (fuel + ResourceLimiter)
wasmtime = { version = "45", optional = true, default-features = false, features = ["cranelift", "runtime"] }
wasmtime-wasi = { version = "45", optional = true }
# Ed25519 signatures for skill integrity and ledger event attestation
ed25519-dalek = { version = "2", optional = true, default-features = false, features = ["std", "rand_core"] }
# Blake3 for hash-chained ledger prev_hash and content hashing
blake3 = { version = "1", optional = true }
# HKDF per-tenant key derivation from master Ed25519 key
hkdf = { version = "0.12", optional = true }

# === V110: Candle CPU backend for in-process local inference ===
# Pure-Rust transformer runtime. CPU-only by default (no CUDA / Metal /
# Accelerate features) to keep build times sane and the dep graph portable.
# Pinned to 0.10 — the candle siblings (-core / -nn / -transformers) must
# share the same minor version or symbol resolution breaks at link time.
candle-core = { version = "0.10", optional = true, default-features = false }
candle-nn = { version = "0.10", optional = true, default-features = false }
candle-transformers = { version = "0.10", optional = true, default-features = false }
# HuggingFace tokenizers (tokenizer.json format). esaxx-fast avoids the
# native onig dependency; http feature off — we never download remotely.
tokenizers = { version = "0.23", optional = true, default-features = false, features = ["esaxx_fast", "fancy-regex"] }

# === V112: llama-cpp-2 backend for in-process local inference ===
# Safe Rust wrapper over llama.cpp via bindgen (`llama-cpp-sys-2`). Requires
# libclang at build time. CPU-only by default — GPU support is opt-in via
# upstream features (`cuda`, `metal`) which we don't enable yet.
llama-cpp-2 = { version = "0.1", optional = true, default-features = false }
# UTF-8 incremental decoder used by `LlamaModel::token_to_piece` to stitch
# multi-byte glyphs across tokens.
encoding_rs = { version = "0.8", optional = true }

# === V139: host hardware probe ===
# Cross-platform CPU/RAM/OS info. Default features turn off the
# `multithread` flag we don't need — we only call sysinfo from a
# spawn_blocking thread, never from the async runtime.
sysinfo = { version = "0.32", optional = true, default-features = false, features = ["system"] }
# NVIDIA Management Library wrapper. Loads `nvml.dll` / `libnvidia-ml.so`
# at runtime; absence of the driver is a recoverable error, not a panic.
nvml-wrapper = { version = "0.12", optional = true }

# V78: libc is only needed by ai_proxy on Unix for O_NOFOLLOW when opening the
# audit log (symlink-safe append). Already transitive via other deps; declared
# here as a direct dep so `ai_proxy.rs` can name it. No effect on Windows.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

