# ai_assistant — cbindgen configuration (V79 FFI)
#
# Drives `build.rs` → `cbindgen::Builder` when building with --features ffi.
# The output is committed at `include/ai_assistant.h` so downstream
# C/C++/C# consumers can use it without running cargo.

language = "C"
header = """\
/* ai_assistant FFI — auto-generated by cbindgen. DO NOT EDIT. */
/* Licensed under PolyForm Noncommercial 1.0.0 — see LICENSE. */
"""
include_guard = "AI_ASSISTANT_H"
pragma_once = true
cpp_compat = true
style = "both"
usize_is_size_t = true
no_includes = false
sys_includes = ["stddef.h", "stdint.h", "stdbool.h"]

# cbindgen auto-detects all `pub extern "C"` fns and `pub` types in the
# crate. Since every FFI symbol lives in `src/ffi.rs`, we restrict
# `item_types` to keep cross-crate `pub const` definitions (which cbindgen
# would otherwise emit as stray `#define`s polluting the header) out of
# the FFI ABI surface. We only emit functions, static globals (for the
# AI_OK/AI_ERR_* codes, which are `pub static`), enums (AiProviderKind),
# and opaque structs (AiAssistantHandle).

[export]
item_types = ["functions", "globals", "enums", "structs"]
# Opt-out list for the few cross-crate structs cbindgen might still try
# to emit (types referenced elsewhere in the crate via `#[repr(C)]`).
exclude = ["Priority"]

[parse]
parse_deps = false
# We intentionally do NOT set [parse.expand]. Expansion runs `cargo expand`
# which is slow and only needed for macro-generated symbols. Our FFI
# surface is entirely hand-written `#[no_mangle] pub extern "C" fn`, no
# macros, so expansion is unnecessary.

[fn]
prefix = ""
postfix = ""
# Rust function names already include the `ai_assistant_` prefix, so no
# rename rule needed.

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true
# Result: AiProviderKind::Ollama → C constant AI_PROVIDER_KIND_OLLAMA
