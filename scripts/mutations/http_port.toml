# Las mutaciones del puerto HTTP (N77, V427).
#
# Este modulo es el sitio donde una decision se toma UNA vez para los 60 que hoy
# la toman cada uno por su cuenta. Eso es su valor y tambien su riesgo: un fallo
# aqui no se queda aqui. Y todos los fallos candidatos devuelven cosas
# plausibles --- un error sin cuerpo sigue siendo un error, una cabecera que no
# se encuentra sigue siendo un `None`, un cuerpo cortado sigue siendo bytes.
#
# Run: python scripts/mutate.py --spec scripts/mutations/http_port.toml

features = "full"
filter = "http_client::tests"

# ---------------------------------------------------------------------------
# M1: el no-2xx vuelve a perder su cuerpo
# ---------------------------------------------------------------------------
# La razon de ser del puerto. Sin `http_status_as_error(false)`, en ureq 3 un 404
# llega como `Error::StatusCode(404)` SIN la respuesta, y con el se va el mensaje
# del proveedor y el `Retry-After` del 429. Eran diez decisiones sueltas antes de
# V427 (y dos de los doce sitios lo tenian mal); aqui es una, y por eso hay que
# vigilarla.
[[mutation]]
id = "M1"
file = "src/http_client.rs"
filter = "http_client::tests::test_port_returns_non_2xx_with_its_body"
invariant = "el no-2xx vuelve como respuesta completa, con estado y cuerpo, y no como un error sin cuerpo --- el cuerpo es donde el proveedor explica por que dijo no"
# Re-anclada en V431: la configuracion dejo de crear un agente por peticion y
# pasa por `Agent::configure_request` sobre el compartido. El invariante no ha
# cambiado --- lo que se vigila es que el `false` siga ahi.
before = """        let mut config = SHARED_AGENT
            .configure_request(http_request)
            .timeout_global(Some(request.timeout))
            .http_status_as_error(false);"""
after = """        let mut config = SHARED_AGENT
            .configure_request(http_request)
            .timeout_global(Some(request.timeout));"""
occurrences = 1

# ---------------------------------------------------------------------------
# M2: las cabeceras del llamante no se aplican
# ---------------------------------------------------------------------------
# El hueco que hacia inservible el trait de tres metodos: `get_json(url,
# timeout)` no tenia donde poner un `Authorization`, y por eso 35 ficheros lo
# esquivaban. Si el bucle deja de aplicarlas, el puerto vuelve a ser inservible
# para los mismos 35 --- y lo hace en silencio, porque la peticion sale y el
# servidor contesta 401, que se lee como "la clave esta mal".
[[mutation]]
id = "M2"
file = "src/http_client.rs"
filter = "http_client::tests::test_port_sends_custom_headers"
invariant = "las cabeceras que pone el llamante llegan al cable; sin ellas el puerto no sirve para ningun proveedor que pida autenticacion, y el sintoma es un 401 que parece una clave mala"
before = """        for (name, value) in &request.headers {
            builder = builder.header(name, value);
        }"""
after = """        for (name, value) in &request.headers {
            let _ = (name, value);
        }"""
occurrences = 1

# ---------------------------------------------------------------------------
# M3: `error_for_status` deja de contar lo que paso
# ---------------------------------------------------------------------------
# Un "HTTP 400" a secas manda al lector a buscar en el sitio equivocado. El
# cuerpo es el diagnostico, y es lo unico que distingue "falta un campo" de
# "modelo inexistente" de "sin credito".
[[mutation]]
id = "M3"
file = "src/http_client.rs"
filter = "http_client::tests::test_port_returns_non_2xx_with_its_body"
invariant = "el error de un no-2xx lleva el cuerpo dentro del mensaje; sin el, 'HTTP 400' no dice que arreglar"
before = """        let body = String::from_utf8_lossy(&self.body);
        let shown: String = body.chars().take(500).collect();"""
after = """        let shown = String::new();"""
occurrences = 1

# ---------------------------------------------------------------------------
# M4: el tope del cuerpo deja de ser el que pidio el llamante
# ---------------------------------------------------------------------------
# El defecto no es que falle: es que NO falle cuando deberia. Un llamante que
# pide 64 KiB porque sabe lo que espera, y recibe 10 MiB, se ha quedado sin la
# proteccion que pidio.
[[mutation]]
id = "M4"
file = "src/http_client.rs"
filter = "http_client::tests::test_port_body_limit_fails_instead_of_truncating"
invariant = "el tope del cuerpo es el que pidio la peticion, no el de la casa"
before = "            .limit(request.max_body_bytes)"
after = "            .limit(DEFAULT_MAX_BODY_BYTES)"
occurrences = 1

# ---------------------------------------------------------------------------
# M5: la busqueda de cabeceras pasa a ser sensible a mayusculas
# ---------------------------------------------------------------------------
# Los nombres de cabecera son insensibles a mayusculas por RFC 9110, y un
# servidor puede mandar `retry-after` donde otro manda `Retry-After`. Comparar
# literalmente da `None` --- que se lee como "el servidor no mando la cabecera"
# --- y el backoff de N46 se cae al valor por defecto sin decir nada.
[[mutation]]
id = "M5"
file = "src/http_client.rs"
filter = "http_client::tests::test_port_reads_response_headers_ignoring_case"
invariant = "una cabecera se encuentra sin importar las mayusculas; si no, un `None` falso se lee como 'el servidor no la mando' y el backoff se degrada en silencio"
# Re-anclada en V429: al anadir `HttpStream` copie el cuerpo de la busqueda,
# y esta puerta lo cazo diciendo "la spec dice 1 ocurrencia, el fichero tiene
# 2". La duplicacion se quito extrayendo `find_header`, asi que el ancla apunta
# otra vez a UNA implementacion --- y ahora la mutacion afecta a los dos tipos,
# que es lo correcto: es una sola regla.
before = "        .find(|(k, _)| k.eq_ignore_ascii_case(name))"
after = "            .find(|(k, _)| k == name)"
occurrences = 1

# ===========================================================================
# El primer consumidor migrado (V428): academic_search y su backoff de N46.
#
# Estas dos existen porque la migracion solo vale si el comportamiento que
# tenia el modulo sigue ahi, y hasta V428 NO HABIA FORMA DE COMPROBARLO: el
# `get_with_retry` construia su propia peticion de ureq y hablaba con el mundo,
# asi que para ver si un 429 se reintentaba hacia falta un servidor que te
# limitara de verdad. Ahora recibe el cliente y se le puede dar uno falso.
# ===========================================================================

[[mutation]]
id = "M6"
file = "src/academic_search.rs"
filter = "academic_search::tests::test_get_with_retry_honours_a_429_and_then_succeeds"
invariant = "el `Retry-After` del 429 se LEE y manda sobre el exponencial; perderlo no rompe nada visible --- simplemente se espera lo que uno adivina en vez de lo que el servidor pidio, que es el defecto que N46 arreglo"
before = "                let retry_after = resp.header(\"Retry-After\").map(|s| s.to_string());"
after = "                let retry_after: Option<String> = None;"
occurrences = 1

[[mutation]]
id = "M7"
file = "src/academic_search.rs"
filter = "academic_search::tests::test_get_with_retry_gives_up_as_rate_limit_not_as_network_failure"
invariant = "agotar los intentos contra un 429 es `RateLimit`, no `Network`: el llamante los trata distinto y 'te estan limitando' se arregla con una clave de API mientras 'la red no va' no"
before = """                    Some(_) => {
                        return Err(AcademicSearchError::RateLimit(format!("""
after = """                    Some(_) => {
                        return Err(AcademicSearchError::Network(format!("""
occurrences = 1

# ===========================================================================
# M8: el agente deja de ser compartido, y con el se va el pool
# ===========================================================================
# El defecto que esta mutacion reintroduce es el que tenia la PRIMERA version del
# puerto (V427): un `Agent` por `send`, y como el pool de conexiones vive en el
# `Agent`, cada peticion abria TCP y TLS de cero. No falla nada, no avisa nadie y
# los tests pasan: solo va mas lento, que es la clase de defecto que no se ve
# hasta que alguien mide.
#
# Se vigila contando CONEXIONES y no milisegundos. Contra un servidor en
# localhost no hay RTT ni handshake TLS que ahorrar, asi que una medida de
# latencia diria "no se nota" sobre algo que si esta pasando.
[[mutation]]
id = "M8"
file = "src/http_client.rs"
filter = "http_client::tests::test_shared_agent_reuses_one_connection"
invariant = "el agente es compartido, que es donde vive el pool: tres peticiones seguidas usan UNA conexion y no tres"
# PRIMERA VERSION: anclada en el `SHARED_AGENT` de `prepare`, y SOBREVIVIO.
# El diagnostico vale mas que la mutacion: `prepare` solo CONFIGURA la peticion,
# y quien abre la conexion es el `run` de `send`. Mutar el receptor del
# `configure_request` no cambia que agente ejecuta, asi que seguia habiendo una
# sola conexion y el test no notaba nada.
#
# De paso dejo a la vista algo que `ureq` documenta y no comprueba: configurar
# una `http::Request` con un agente y ejecutarla con OTRO es un error segun su
# propia documentacion (`agent.rs:300`), y no salto nada. Anclada ahora donde de
# verdad decide: el `run`.
before = """        let mut response = SHARED_AGENT
            .run(Self::prepare(request)?)"""
after = """        let mut response = ureq::Agent::new_with_defaults()
            .run(Self::prepare(request)?)"""
occurrences = 1

# ===========================================================================
# M9: el camino caliente vuelve a emitir el cuerpo de un error como respuesta
# ===========================================================================
# El invariante mas peligroso de toda la migracion. Antes lo garantizaba
# `send_json(..)?`: un no-2xx era `Err`, y con eso se reintentaba y se reportaba.
# Detras del puerto el no-2xx es un `Ok`, asi que quitar el `error_for_status()`
# del cierre hace que el cuerpo del error se emita trozo a trozo **como si fuera
# lo que dijo el modelo**. El usuario leeria una pagina de error de nginx
# creyendo que es la respuesta del asistente, y nada en el programa se queja.
#
# Se mutan los CUATRO cierres de streaming a la vez: son identicos, y el test
# cubre el de Ollama.
[[mutation]]
id = "M9"
file = "src/providers.rs"
# El filtro es un SUBSTRING, y casa con los cuatro tests --- uno por ruta.
# La primera version apuntaba solo al de Ollama y tres de las cuatro
# mutaciones SOBREVIVIERON: no porque la mutacion fuera inocua, sino porque
# esas tres rutas no tenian ningun test. `occurrences = 4` son cuatro
# mutaciones, y cada una necesita quien la vea.
filter = "does_not_emit_an_error_body_as_model_output"
invariant = "un no-2xx en el camino caliente es un ERROR, no contenido: sin esto el cuerpo del error llega al usuario como texto del asistente"
before = """        // Conserva lo que `send_json(..)?` garantizaba: un no-2xx es un error,
        // asi que se reintenta y se reporta en vez de emitirse como respuesta.
        resp.error_for_status()?;
        Ok(resp)"""
after = """        Ok(resp)"""
occurrences = 4
