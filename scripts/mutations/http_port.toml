# `{ Ok(_) => Ok(true), Err(_) => Ok(false) }`, y el `Ok(_)` valia porque `ureq`
# metia el no-2xx en el `Err`. Detras del puerto casa tambien con un 500, asi
# que un backend que contesta «error interno» pasa por sano --- y el que elige
# backend se queda con el roto.
#
# UNA ocurrencia, y eso es el punto: la guarda esta EXTRAIDA a
# `probe_is_healthy`, asi que un test la cubre entera. Los `get` de abajo (M12)
# la tienen escrita en linea tres veces, y necesitan tres.
