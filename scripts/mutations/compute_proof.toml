# Mutations for the SHA-256 surface this crate still owns, in `src/sha256.rs`.
#
# HISTORY, BECAUSE IT EXPLAINS THE SHAPE
# --------------------------------------
# V397 collapsed five hand-written SHA-256 copies into one implementation here
# (N141) and this spec followed it. V404 replaced that implementation with the
# `sha2` crate, measured: `sha2` is 7.4x-8.8x faster on this machine, costs ONE
# extra crate (all eight of its dependencies were already in the lock), and
# `cargo check --no-default-features` stays clean -- which was the whole reason
# the hand-written version existed.
#
# So the compression function is no longer ours, and the mutations that targeted
# it -- the FIPS initial state, the bit-length padding field -- went with it. The
# first dry-run after V404 reported 5 of 5 NOT_APPLIED, which proves nothing.
# They are NOT deleted to go green: they are replaced by mutations of the
# invariants that are still in this tree, which is a smaller and honest set.
#
# WHAT IS LEFT TO GUARD
# ---------------------
# Two things, both thin and both load-bearing:
#
#   1. `sha256_hex`'s formatting. `sha2` does not provide hex, so this is ours.
#      A digest formatted without zero-padding, or in uppercase, is the SAME
#      BYTES and compares unequal to every published value and to every peer
#      that sends a lowercase hex digest. That is a wire-format defect wearing
#      the costume of a cosmetic one.
#   2. The one-shot wrapper over an incremental API. `sha2` wants
#      new/update/finalize; this module hides that behind a function. Feeding the
#      data twice, or not at all, is a one-token slip that produces a perfectly
#      well-formed 32-byte digest of the wrong thing.
#
# WHY THE PAIRS SURVIVE THE REWRITE
# ---------------------------------
# The original insight is still true and still worth measuring: `compute_proof`
# has three tests that pass their value through the hash on BOTH sides --
# `generate` hashes, `verify_hash` re-hashes and compares -- so any deterministic
# function satisfies all three. That is not hypothetical: an earlier sweep in
# this crate found a function named `sha256_hex` computing FNV-1a, with a comment
# above it claiming SHA-256.
#
# So each mutation appears TWICE:
#
#   * `<id>`  runs only `sha256::tests` and must DIE -- the known-answer test
#     earns its place or it does not exist.
#   * `<id>b` runs only `compute_proof::tests::test_` and is expected to
#     SURVIVE -- recording, as a measurement rather than a worry, that those
#     three cannot tell a corrupted digest from a correct one.
#
# The `b` entries are NOT claims of behavioural equivalence. Each says so in its
# `note`, because `expect = "survives"` usually means "equivalent" and here it
# means "this test set is blind".
#
# This matters because the hash IS the security property:
# `ComputeProof::verify_hash` is what a downstream verifier calls to decide an
# LLM result was not forged.
#
# Run: python scripts/mutate.py --spec scripts/mutations/compute_proof.toml

features = "full"
filter = "sha256::tests"

# ---------------------------------------------------------------------------
# M1 -- zero-padding in the hex formatter. Dropping it shortens the digest for
# every byte below 0x10, so `sha256_hex` returns a string of fewer than 64
# characters that is still hex, still deterministic, and unequal to every
# published vector. ~1 in 16 bytes triggers it, so a careless test using one
# fixed input can miss it entirely.
# ---------------------------------------------------------------------------

[[mutation]]
id = "M1"
file = "src/sha256.rs"
invariant = "hex digits are zero-padded, so the digest is always 64 characters and matches what every peer and every published vector uses"
before = '        .map(|b| format!("{b:02x}"))'
after = '        .map(|b| format!("{b:x}"))'
occurrences = 1

[[mutation]]
id = "M1b"
file = "src/sha256.rs"
filter = "compute_proof::tests::test_"
expect = "survives"
note = "NOT equivalent -- M1 proves the same change is caught by the known-answer test. This entry records that compute_proof's three tests cannot catch it, because they format with the mutated function on both sides of every comparison."
invariant = "compute_proof's three tests are blind to a malformed hex digest"
before = '        .map(|b| format!("{b:02x}"))'
after = '        .map(|b| format!("{b:x}"))'
occurrences = 1

# ---------------------------------------------------------------------------
# M2 -- case. Uppercase hex is the same bytes and the same length, so a test
# that only checks `len() == 64` and `is_ascii_hexdigit()` passes. It breaks
# every comparison against a lowercase digest, which is what the published
# vectors and every peer use.
# ---------------------------------------------------------------------------

[[mutation]]
id = "M2"
file = "src/sha256.rs"
invariant = "hex is lowercase, which is what the published vectors and the wire format use"
before = '        .map(|b| format!("{b:02x}"))'
after = '        .map(|b| format!("{b:02X}"))'
occurrences = 1

[[mutation]]
id = "M2b"
file = "src/sha256.rs"
filter = "compute_proof::tests::test_"
expect = "survives"
note = "NOT equivalent -- M2 proves the same change is caught. Recorded because case is the kind of difference that survives a shape-only assertion: 64 characters, all hex digits, and wrong."
invariant = "compute_proof's three tests are blind to the digest's case"
before = '        .map(|b| format!("{b:02x}"))'
after = '        .map(|b| format!("{b:02X}"))'
occurrences = 1

# ---------------------------------------------------------------------------
# M3 -- the one-shot wrapper over `sha2`'s incremental API. Feeding the input
# twice yields the digest of `data || data`: well-formed, 32 bytes, lowercase,
# deterministic, and wrong. This is the whole risk the wrapper introduces, and
# it is new in V404 -- the hand-written version had no update step to double.
# ---------------------------------------------------------------------------

[[mutation]]
id = "M3"
file = "src/sha256.rs"
invariant = "the input is fed to the hasher exactly once"
before = "    hasher.update(data);"
after = "    hasher.update(data);\n    hasher.update(data);"
occurrences = 1

[[mutation]]
id = "M3b"
file = "src/sha256.rs"
filter = "compute_proof::tests::test_"
expect = "survives"
note = "NOT equivalent -- M3 proves the same change is caught by the known-answer test. Recorded because hashing the input twice is deterministic and injective, which is exactly the property compute_proof's round-trip tests rely on and therefore cannot distinguish."
invariant = "compute_proof's three tests are blind to the input being hashed twice"
before = "    hasher.update(data);"
after = "    hasher.update(data);\n    hasher.update(data);"
occurrences = 1
