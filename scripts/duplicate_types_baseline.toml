# Baseline for scripts/check_duplicate_types.py
#
# Two sections, because "someone decided this is fine" and "nobody has looked at
# this yet" are different claims and collapsing them would let this file lie.
#
#   [allowed]   — judged. One reason per name, and the checker REFUSES an entry
#                 whose reason is empty. An unargued exemption reads as reviewed
#                 to whoever finds it next, and then nobody re-reads it.
#   [untriaged] — frozen, NOT judged. The pre-existing list, kept so the count
#                 cannot grow while it is being worked through.
#
# Names that are structurally unconfusable are NOT listed here: the checker
# classifies `src/bin/*.rs`-only declarations as SEPARATE_BINARIES (separate crate
# roots, no shared scope — `Tab` in three GUI binaries) and sibling `#[cfg]` inline
# modules as CFG_ALTERNATIVES. Putting those in a baseline would imply a judgement
# that was never needed.

[allowed]
# Triaged 2026-10-14 (N134). The judgement was made from the FULL variant list
# of every declaration plus the module each lives in -- that is enough when the
# variant sets share nothing and the two modules are in unrelated domains, and
# it is NOT enough otherwise. The names where it was not enough deliberately
# stayed in [untriaged] below rather than being blessed with a plausible reason,
# because a reason that was never checked is exactly what this file's header
# warns about.
#
# The signal that drove the split is variant-set overlap: these eleven share
# zero or one variant with their namesake AND sit in unrelated subsystems.
BackendError = "container_backend's is a container runtime failure (ImageNotFound, PolicyViolation); local_inference's is an inference backend failure (NotImplemented, ModelNotFound). Two unrelated kinds of backend, one overlapping variant (`Io`) by coincidence."
Capability = "skill_forge/capability's is a PERMISSION a skill requests (NetFetch, FileRead, ToolCall); wasm's is a HOST feature a module can use (Filesystem, Threads, Sqlite). Zero shared variants, opposite directions: one is asked for, the other offered."
CompressionLevel = "cache_compression's is a zlib-style effort dial (Fast, Default, Best, Custom); context_budget's is how aggressively to DISCARD context (Light, Medium, Aggressive). One compresses bytes losslessly, the other drops meaning."
ConfigError = "error.rs's is the crate's config loading failure (MissingValue, LoadFailed); prompt_breeder/config's is validation of an evolutionary-search configuration (PopulationTooSmall, ParetoNeedsMultipleObjectives). Zero overlap and no shared vocabulary."
GateAction = "agent_methodology's is what the AGENT does next (Retry, AskUser, Abort); quality_gates' is how a gate REPORTS (Fail, Warn, Log). One is control flow, the other a severity."
LogLevel = "events.rs's is a VERBOSITY THRESHOLD for LoggingHandler -- three levels (Debug/Info/Warn) chosen by the caller to decide how much to emit, with no ordering and no Display; distributed_log.rs's is the SEVERITY OF AN ENTRY (Trace=0..Error=4), ordered and Display-able so it can be stored and filtered. Threshold vs tag: the same word for the two ends of the same mechanism. And they cannot share a type without a third home: events.rs is always compiled, distributed_log.rs is behind `distributed-network`, so unifying as-is would make an always-compiled module depend on a gated one (N51). Measured 2026-10-20 (V410)."
MergeStrategy = "entity_enrichment's resolves conflicting entity attributes (KeepHighestConfidence, Manual); multi_layer_graph's is CRDT conflict resolution (Ours, Theirs, Union). The second is a standard CRDT vocabulary and cannot borrow the first's."
OutputFormat = "document_pipeline's is a FILE format to write (Pdf, Docx, Epub); output_validation's is the SHAPE expected of a model's answer (PlainText, Json, Table). Zero overlap."
OverflowAction = "context_composer's is what to do when the CONTEXT WINDOW overflows (Compact, Checkpoint, NewSession); feedback_loop/queue's is what a bounded QUEUE does when full (DroppedOldest, NoDrop)."
StepKind = "recipes' is a step in a user-authored recipe (Prompt, Tool, Recipe, Shell); skill_forge/declarative's is a node in a generated skill plan (Plan, Branch, Return). Different authors, different executors."
StopReason = "acp.rs's is the Agent Client Protocol's WIRE enum, fixed by the spec (EndTurn, MaxTokens, Refusal); self_correction's is why a correction LOOP exited (AllPassed, TokenBudgetExhausted, QualityRegression). The first cannot change without breaking the protocol."
Subsystem = "scalability_monitor's names things whose SIZE is watched (VectorDbHnsw, EmbeddingCache); storage_context's names things that PERSIST (Bandit, Tiers, Snapshots). Overlapping membership would be a coincidence, not a contract."

AudioFormat = "speech's is a FILE/codec list (Wav, Mp3, Ogg, Flac, Pcm, Opus, Aac); voice_agent's is the WIRE format of a streamed voice chunk (Pcm16, Wav, Ogg, Mp3). The tell is Pcm16 against Pcm: a wire format must pin bit depth and endianness, a file-format list must not. Three names overlap because those containers exist in both worlds."
ImageFormat = "image_extraction's is what was FOUND inside a document (Jpeg, Png, Gif, Bmp, Tiff, Unknown); media_generation's is what a model can PRODUCE (Png, Jpeg, WebP, Svg). The tell is 'Unknown': an extractor needs it and a generator cannot have it. The tails are disjoint for the same reason - nobody generates Tiff, nobody finds Svg in a scan."
WarningSeverity = "agent_definition's is a VERDICT ON A DOCUMENT (Info/Warning/Error, where Error means the definition cannot be used as-is), with no ordering derive and no Display; scalability_monitor's is a BAND ON A CONTINUOUS MEASUREMENT (Info/Warning/Critical, with 60-79%/80-94%/95%+ written into the doc comments), deriving PartialOrd+Ord+Display because it is compared and printed. The tell is NOT Error against Critical: it is that a validation verdict has no natural order to derive, and a threshold band is useless without one. Merging them would have to either impose an order on the verdicts or take it away from the bands. Triaged 2026-10-23 (V425) -- and the [untriaged] note that preceded it said 'Info/Warning/{Error,Critical}. One word apart', which was a judgement by VARIANT NAME and came out backwards."

StepType = "cot_parsing's classifies a REASONING step in text (Understanding, Decomposition, Verification, Conclusion); distillation's records an EXECUTED action with its payload (LlmCall, ToolUse, Decision). Zero shared variants and different kinds of thing: one reads prose, the other logs behaviour."

[untriaged]
# 16 names left, down from 34. (Decia 22 con 17 en la lista: la cuenta a mano
# del comentario se quedo atras de los datos, que es el defecto que este
# fichero entero existe para evitar. Cuentalos, no los recuerdes.) NOT
# blessed -- the opposite: these are
# the ones where the two declarations look like the SAME IDEA that drifted, so
# each is real work rather than a coincidence of naming. One line per name with
# what the overlap says, so the next person starts from the evidence:
#
#   AuditEventType     both are audit events and share SessionCreated/SessionDeleted; server.rs's six look like a subset of security/audit's twenty.
#   CompressionError   2 of 4 shared and both are compression failures (cache_compression,
#                      streaming_compression). Same idea, two vocabularies.
#   ChangeType         3 of 4 variants shared; diff.rs adds `Equal` and content_versioning is a strict subset. Looks like one type.
#   DiversityMetric    zero literal overlap and the same job: measure how different two texts are. Jaccard and cosine appear in both, at different granularity.
#   EnsembleStrategy   zero literal overlap but the SAME job: combine several model outputs. MajorityVote/Voting and WeightedAverage/WeightedVoting are the same idea spelled twice.
#   EntityType         both classify entities (NER against knowledge graph) and share Person/Organization/Location.
#   EvictionPolicy     REAL duplication, leida 2026-10-23 (V425): las dos son 'a quien
#                      echo de una cache acotada', las dos tienen Default = Lru y las dos
#                      son #[non_exhaustive]. Y `Lrw` (least recently written, 'evict the
#                      oldest entry by creation time') ES `Fifo` ('evict oldest items'):
#                      DOS NOMBRES PARA UNA POLITICA, que es el patron de EnsembleStrategy
#                      e IntegrityResult. distributed: Lru/Lrw/LargestFirst;
#                      memory_management: Lru/Lfu/Fifo/Ttl/Random (este si es Serialize).
#   ExportFormat       THREE declarations, all with `Json`. distributed_log, export and opentelemetry_integration each invented their own.
#   IceState           REAL work, y EL DESTINO YA EXISTE. Leida 2026-10-23 (V425):
#                      `crate::ice` se creo en V347 justo para esto -- su propio doc dice
#                      'ICE types shared by every transport that has to get through a NAT'
#                      y nombra los tres modulos (p2p, distributed_rag, voice_agent).
#                      `IceCandidateType` se movio alli; `IceState` se quedo atras, y hay
#                      un comentario en distributed_rag.rs:145 que lo cuenta.
#                      distributed_rag: New/Gathering/Checking/Connected/Completed/Failed/
#                      Closed, con Default = New y Serialize. p2p: las cinco de en medio.
#                      Las dos que faltan son las dos que el RFC 8445 necesita y que p2p
#                      POR TANTO NO PUEDE REPRESENTAR: `New` (creado, aun sin reunir
#                      candidatos -- `IceAgent::new()` arranca en Gathering, afirmando que
#                      ya empezo) y `Completed` (todas las comprobaciones hechas, distinto
#                      de Connected). Y la de p2p NO es Serialize, asi que su estado no
#                      puede cruzar el cable... en el modulo peer-to-peer. Mismo molde que
#                      el StepStatus de V406, donde un paso de plan no podia fallar.
#                      Precedente de que esto muerde: N90, dos conjuntos de features verdes
#                      que no se podian combinar por el `IceCandidateType` duplicado.
#   IntegrityResult    zero literal overlap and the same job: report whether an integrity check passed. Valid/Ok and HashMismatch/Tampered are the same outcomes renamed.
#   LogLevel           events.rs's three are a strict subset of distributed_log's five.
#   MemoryType         both classify a memory; share Fact/Preference.
#   ParameterType      5 of 7 shared; tool_calling says `Float` where tools says `Number`. This is part of the tool-registry triplication (N135) and should be resolved there, not here.
#   ProviderStatus     zero literal overlap, but widgets' is the GUI showing provider health while fallback's IS provider health. The GUI should probably render the real one instead of its own.
#   QueueError         FOUR declarations across four queues. Individually defensible, collectively a smell: `Full` and `PriorityFull` and `QueueFull` are the same error.
#   ResponseStyle      both describe the style of a generated answer; share Technical.
#   RiskLevel          4 of 6 shared; the only difference is `Safe` against `None` for the bottom of the scale.
#   TaskStatus         both are task lifecycle; share Pending/InProgress. mcp_task_tools' three look like a coarse view of multi_agent's six.
#   TaskType           8 of 18 shared, and BOTH classify a task in order to pick a model (auto_model_selection, routing). Same job, two vocabularies.
#   WarningSeverity    Info/Warning/{Error,Critical}. One word apart.
#
# RESOLVED 2026-10-14 (V407). AudioFormat, ImageFormat and StepType were the
# three the gate counted at two declarations where a quick grep found one. The
# GREP was wrong, not the gate: all three second declarations sit inside an
# indented `mod inner { ... }`, and the regex was anchored to column 0. Same
# trap as the column-0 regexes that once hid half the broken doc examples - a
# `^pub enum` anchor cannot see a nested module. All three are judged now and
# live in [allowed]; search with `grep -rn "enum <Name>"`, without the anchor.
#
# Tracked as N134. Moving one here to [allowed] needs a reason that survives
# reading BOTH declarations in full, not just their variant names.
names = [
  "AuditEventType",
  "CompressionError",
  "DiversityMetric",
  "EnsembleStrategy",
  "EntityType",
  "EvictionPolicy",
  "ExportFormat",
  "IceState",
  "MemoryType",
  "ParameterType",
  "ProviderStatus",
  "QueueError",
  "ResponseStyle",
  "RiskLevel",
  "TaskStatus",
  "TaskType",
]
