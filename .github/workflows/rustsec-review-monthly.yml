name: RUSTSEC Review (Monthly)

# V142 — keep the deny.toml#advisories.ignore list honest.
#
# Why this exists: every `--ignore RUSTSEC-XXXX-NNNN` is a promise
# that the advisory *does not apply to our usage*. That promise can
# rot: upstream releases a fixed version, or a refactor here trips
# the previously-untouched codepath. Without a periodic forcing
# function, the ignore list grows and nobody re-checks the entries.
#
# This workflow runs on the 1st of every month and:
#   * runs `cargo audit --json` without any --ignore flags,
#   * cross-references the report against deny.toml#advisories.ignore,
#   * opens (or updates) a tracking issue listing every ignored entry
#     plus the current advisory status — operator must close it after
#     reviewing each line per docs/runbooks/rustsec-handling.md.
#
# Gating is unchanged: `cargo deny check` + `cargo audit` on PRs
# still respect the ignores. This workflow only nags humans.

on:
  schedule:
    # 1st of month at 07:00 UTC — picks up advisory-db updates that
    # landed during the previous month.
    - cron: '0 7 1 * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always

jobs:
  review:
    name: Monthly RUSTSEC ignore review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.98.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: rustsec-review-monthly

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: Collect ignore list from deny.toml
        id: ignores
        run: |
          set -euo pipefail
          # Only the quoted entries inside `ignore = [ ... ]`. The range scan
          # this replaced read the COMMENTS as well, so RUSTSEC-2026-0222 --
          # deleted from the list on purpose, with a comment recording the
          # deletion -- came back into the review issue every month. A comment
          # documenting an ABSENCE was read as a PRESENCE, which sent the
          # operator to re-check something that is not suppressed and implied,
          # by listing it at all, that it is.
          # Guarded by scripts/check_rustsec_ignores.py.
          ids=$(sed -n '/^ignore = \[/,/^\]/p' deny.toml \
            | grep -oE '"RUSTSEC-[0-9]+-[0-9]+"' | tr -d '"' | sort -u)
          echo "ids<<EOF" >> "$GITHUB_OUTPUT"
          echo "$ids" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Ignored entries to review:"
          echo "$ids"

      - name: Run cargo audit (unsuppressed, JSON)
        id: audit
        # Always exit 0 — we treat the report, not the exit code, as
        # the source of truth here. The PR gating already runs the
        # suppressed audit elsewhere.
        run: |
          set +e
          cargo audit --json > audit.json
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          # `.vulnerabilities.list[]` is NOT the whole report, and reading only
          # it was a real defect (V405). `cargo audit` splits its findings:
          #
          #   .vulnerabilities.list[]  -> array, the ones with a CVE-shaped fix
          #   .warnings                -> OBJECT keyed by kind: "unmaintained",
          #                               "unsound", "yanked", each a list
          #
          # Everything in `.warnings` was therefore reported as "NO LONGER
          # REPORTED — consider removing". On 2026-10-13 that was FIVE of the
          # eight suppressions: bincode, paste and rustls-pemfile (unmaintained),
          # ttf-parser (unmaintained) and lru (unsound). All five are still
          # reported; the bot simply was not looking at that half of the report.
          #
          # And the advice was not merely wrong, it was harmful: **cargo-deny
          # DENIES `unmaintained` where cargo-audit only warns**, so removing
          # those five suppressions turns the Supply Chain workflow red. For
          # five months the issue recommended an action that breaks the build,
          # and the only reason nothing broke is that nobody acted on it.
          #
          # So: collect both, and carry the CATEGORY, because "reported" and
          # "reported as a vulnerability" are different facts and the operator
          # needs the second one to decide.
          jq -r '
            ( .vulnerabilities.list[]? | "\(.advisory.id)\tvulnerability" ),
            ( .warnings? // {} | to_entries[] | .key as $kind
              | .value[]? | "\(.advisory.id)\t\($kind)" )
          ' audit.json | sort -u > active-advisories.tsv
          cut -f1 active-advisories.tsv | sort -u > active-advisories.txt
          echo "Active advisories from cargo-audit (id + category):"
          cat active-advisories.tsv

      - name: Build review report
        id: report
        run: |
          set -euo pipefail
          {
            echo "## Monthly RUSTSEC ignore review — $(date -u +%Y-%m-%d)"
            echo
            echo "Each entry below is currently in"
            echo "\`deny.toml#advisories.ignore\`. Verify the"
            echo "justification + re-check trigger is still valid. Per"
            echo "[\`docs/runbooks/rustsec-handling.md\`](../blob/master/docs/runbooks/rustsec-handling.md),"
            echo "every entry needs one of: kept, updated, removed."
            echo
            echo "### Ignored entries"
            echo
            while IFS= read -r id; do
              [ -z "$id" ] && continue
              # The categories this id is reported under, comma-joined. An
              # advisory can appear more than once (bincode shows up twice under
              # `unmaintained`, once per version in the tree), so dedup.
              cats=$(awk -F'\t' -v id="$id" '$1==id {print $2}' active-advisories.tsv \
                     | sort -u | paste -sd, -)
              if [ -n "$cats" ]; then
                status="STILL ACTIVE ($cats) — verify ignore is still justified"
              else
                status="NO LONGER REPORTED — consider removing"
              fi
              echo "- \`$id\` — $status"
            done <<< "${IGNORES}"
            echo
            echo "> \`vulnerability\` means cargo-audit fails on it."
            echo "> \`unmaintained\` / \`unsound\` mean cargo-audit only warns —"
            echo "> but **cargo-deny denies \`unmaintained\`**, so removing one of"
            echo "> those suppressions can still turn Supply Chain red. Check"
            echo "> \`deny.toml\` before deleting an entry on the strength of a"
            echo "> category alone."
            echo
            echo "### New advisories (not yet in deny.toml)"
            echo
            new=$(comm -23 active-advisories.txt <(echo "${IGNORES}" | sort -u))
            if [ -z "$new" ]; then
              echo "_(none)_"
            else
              while IFS= read -r id; do
                [ -z "$id" ] && continue
                # Same category, same reason: since V405 this list includes
                # warnings, and an `unsound` advisory nobody has to act on reads
                # very differently from a `vulnerability` that fails the build.
                cats=$(awk -F'\t' -v id="$id" '$1==id {print $2}' active-advisories.tsv \
                       | sort -u | paste -sd, -)
                echo "- \`$id\` ($cats) — investigate; either patch the dep or add to deny.toml with justification + re-check date"
              done <<< "$new"
            fi
            echo
            echo "<sub>Generated by .github/workflows/rustsec-review-monthly.yml</sub>"
          } > report.md
          cat report.md
        env:
          IGNORES: ${{ steps.ignores.outputs.ids }}

      - name: Upload report artifact
        uses: actions/upload-artifact@v6
        with:
          name: rustsec-monthly-report
          path: |
            report.md
            audit.json
            active-advisories.txt
          retention-days: 365

      - name: Open or update tracking issue
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');
            const month = new Date().toISOString().slice(0, 7);
            const title = `RUSTSEC ignore review — ${month}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'supply-chain'
            });
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.update({
                owner, repo, issue_number: match.number, body,
              });
              core.notice(`Updated existing issue #${match.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner, repo, title, body,
                labels: ['supply-chain', 'monthly-review'],
              });
              core.notice(`Opened issue #${created.data.number}`);
            }
