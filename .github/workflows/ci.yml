name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Standard test set — covers core + all lightweight opt-in features
  FEATURES_STD: "full,autonomous,scheduler,butler,browser,distributed-agents,containers,audio,workflows,prompt-signatures,a2a,voice-agent,media-generation,distillation,constrained-decoding,hitl,webrtc,devtools,eval-suite,chaos-testing"
  # Heavy networking features (separate due to quinn/rustls deps)
  FEATURES_NETWORK: "full,distributed-network,p2p,gpu-sharing,server-axum,server-cluster"

jobs:
  check:
    name: Cargo Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - name: Check (lightweight features)
        run: cargo check --features full
      - name: Check (standard features)
        run: cargo check --features "$FEATURES_STD"
      - name: Check (network features)
        run: cargo check --features "$FEATURES_NETWORK"

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - name: Run unit tests
        run: cargo test --features "$FEATURES_STD" --lib
      - name: Run integration tests
        run: cargo test --features "$FEATURES_STD" --test '*'

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --features "$FEATURES_STD" -- -W clippy::all

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: cargo-audit
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      # Ignored advisories all live in transitive dependencies that
      # cannot be bumped without major upstream upgrades:
      #   RUSTSEC-2025-0141 — bincode unmaintained (transitive)
      #   RUSTSEC-2024-0436 — paste unmaintained (transitive)
      #   RUSTSEC-2025-0134 — rustls-pemfile unmaintained (transitive)
      #   RUSTSEC-2026-0002 — lru unsound IterMut (transitive via tantivy)
      - name: Run cargo audit
        run: |
          cargo audit \
            --ignore RUSTSEC-2025-0141 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2025-0134 \
            --ignore RUSTSEC-2026-0002

  feature-matrix:
    name: Feature Matrix (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          # Core features (in "full")
          - "multi-agent"
          - "security"
          - "analytics"
          - "vision"
          - "embeddings"
          - "advanced-streaming"
          - "adapters"
          - "tools"
          - "documents"
          - "eval"
          - "rag"
          - "distributed"
          - "containers"
          - "audio"
          # Autonomous combinations
          - "autonomous"
          - "autonomous,scheduler"
          - "autonomous,butler"
          - "autonomous,browser"
          # Networking (Tier 2)
          - "distributed-network"
          - "distributed-network,p2p"
          - "distributed-network,gpu-sharing"
          - "server-axum"
          - "server-axum,server-axum-tls"
          - "server-axum,server-openapi"
          - "server-axum,distributed-network,server-cluster"
          # Advanced features (Tier 2)
          - "voice-agent"
          - "workflows"
          - "prompt-signatures"
          - "constrained-decoding"
          - "a2a"
          - "hitl"
          - "home-automation,coap"
          - "precise-tokens"
          - "diagnostic-logging"
          - "integrity-check"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: feature-${{ hashFiles('Cargo.lock') }}-${{ strategy.job-index }}
      - name: Check ${{ matrix.features }}
        run: cargo check --features "${{ matrix.features }}"
      - name: Test ${{ matrix.features }}
        run: cargo test --features "${{ matrix.features }}" --lib

  binaries:
    name: Binary Compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - name: Build ai_cli
        run: cargo build --bin ai_cli --features "full,diagnostic-logging"
      - name: Build ai_assistant_cli
        run: cargo build --bin ai_assistant_cli --features "full,butler"
      - name: Build ai_assistant_server
        run: cargo build --bin ai_assistant_server --features "full"
      - name: Build kpkg_tool
        run: cargo build --bin kpkg_tool --features "rag"
      - name: Build ai_test_harness
        run: cargo build --bin ai_test_harness --features "full,browser"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Generate coverage
        run: cargo llvm-cov --features "$FEATURES_STD" --lib --lcov --output-path lcov.info
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    # Informational: benchmark regressions don't gate CI.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - name: Run benchmarks
        # Criterion benches (harness = false) compile on stable.
        run: cargo bench --features full -- --output-format bencher | tee output.txt
      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'cargo'
          output-file-path: output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-threshold: '200%'
          comment-on-alert: true
          fail-on-alert: false
          auto-push: false

  release:
    name: Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, test, clippy, fmt, binaries]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - name: Run full test suite
        run: cargo test --features "$FEATURES_STD" --lib
      - name: Build release
        run: cargo build --release --features "$FEATURES_STD"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
