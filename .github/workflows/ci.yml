name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Standard test set — covers core + all lightweight opt-in features
  FEATURES_STD: "full,autonomous,scheduler,butler,browser,distributed-agents,containers,audio,workflows,prompt-signatures,a2a,voice-agent,media-generation,distillation,constrained-decoding,hitl,webrtc,devtools,eval-suite,chaos-testing"
  # Heavy networking features (separate due to quinn/rustls deps)
  FEATURES_NETWORK: "full,distributed-network,p2p,gpu-sharing,server-axum,server-cluster"
  # The smallest set the crate actually builds with (V267). Every other job here
  # starts from `full`, so nothing was ever compiled BELOW it — and the crate had
  # silently stopped building at anything smaller: `prelude` re-exported a
  # `security`-gated module unconditionally, and `server` used an
  # `advanced-streaming`-gated one. Both are the kind of break nobody notices,
  # because nobody compiles that way. This job is what stops it recurring.
  #
  # It is a floor, not an aspiration: these eight are interdependent by design
  # (see the note on `full` in Cargo.toml). Dropping one of them does not
  # currently compile, and that is documented rather than pretended otherwise.
  FEATURES_MIN: "tools,security,advanced-streaming,rag,adapters,analytics,embeddings,documents"

jobs:
  check:
    name: Cargo Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Check (lightweight features)
        run: cargo check --features full
      - name: Check (standard features)
        run: cargo check --features "$FEATURES_STD"
      - name: Check (network features)
        run: cargo check --features "$FEATURES_NETWORK"
      - name: Check (minimum supported features)
        run: cargo check --no-default-features --features "$FEATURES_MIN"

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Run unit tests
        run: cargo test --features "$FEATURES_STD" --lib
      - name: Run integration tests
        run: cargo test --features "$FEATURES_STD" --test '*'

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        # -D warnings makes the "zero warnings" rule structural: any rustc or
        # clippy warning fails CI (was -W, i.e. advisory only).
        #
        # V247: extended to --all-targets. It was previously scoped to lib+bins
        # because tests/examples legitimately use the crate's own #[deprecated]
        # items and #[non_exhaustive] configs — but that blind spot let every
        # example and integration test rot: several stopped compiling entirely
        # (renamed APIs, struct literals for #[non_exhaustive] configs) without
        # CI noticing. Those uses now carry scoped #[allow]s where they are
        # deliberate, so the whole tree can be gated.
        run: cargo clippy --features "$FEATURES_STD" --all-targets -- -D warnings
      - name: Run clippy (network features)
        # The `check` / `feature-matrix` jobs COMPILE the network features
        # (server-cluster, p2p, server-axum, gpu-sharing, distributed-network),
        # but `cargo check`/`test` never run clippy, so their lints went ungated
        # and quietly accumulated. These features stay out of FEATURES_STD due to
        # heavy quinn/rustls deps, so lint them here in a dedicated step —
        # --all-targets for the same reason as above.
        run: cargo clippy --features "$FEATURES_NETWORK" --all-targets -- -D warnings
      - name: Run clippy (minimum supported features)
        # Both sets above start from `full`, so nothing was linted BELOW it and
        # the reduced build silently rotted: unconditional uses of `security`-
        # and `advanced-streaming`-gated modules stopped it compiling at all,
        # and three items were dead once their feature was absent. `cargo check`
        # alone would not have caught the latter — they are warnings, not errors.
        run: cargo clippy --no-default-features --features "$FEATURES_MIN" -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check

  deprecation-policy:
    name: Deprecation policy
    runs-on: ubuntu-latest
    # V127 (C.6): every #[deprecated(...)] attribute in src/ must
    # carry both `since = ` and `note = ` per docs/FEATURE_LIFECYCLE.md.
    # The checker is stdlib-only Python 3.11+ (ubuntu-latest default).
    steps:
      - uses: actions/checkout@v5
      - name: Run deprecation policy checker
        run: python3 scripts/check_deprecation_policy.py --root src

  feature-dep-drift:
    name: Feature/dep drift
    runs-on: ubuntu-latest
    # V154 (#1B): fail if a feature references `dep:X` while `X` is also a
    # feature gated in src/ via cfg(feature = "X"). That drift silently
    # disables the gated code path (and its tests) — the exact bug that
    # broke AES-256-GCM and PDF parsing until V152. Stdlib-only Python.
    steps:
      - uses: actions/checkout@v5
      - name: Run feature/dep drift checker
        run: python3 scripts/check_feature_dep_drift.py --manifest Cargo.toml --root src

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: cargo-audit
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      # Ignored advisories all live in transitive dependencies that
      # cannot be bumped without major upstream upgrades:
      #   RUSTSEC-2025-0141 — bincode unmaintained (transitive)
      #   RUSTSEC-2024-0436 — paste unmaintained (transitive)
      #   RUSTSEC-2025-0134 — rustls-pemfile unmaintained (transitive)
      #   RUSTSEC-2026-0002 — lru unsound IterMut (transitive via
      #                       tantivy/lance; no direct lru usage)
      #   RUSTSEC-2026-0187 — lopdf stack overflow on deeply-nested PDFs
      #                       (transitive via pdf-extract 0.7.12, which
      #                       pins lopdf ^0.34; no pdf-extract release uses
      #                       lopdf >=0.42 yet). Only reachable behind the
      #                       opt-in `documents`/`pdf-extract` feature; DoS
      #                       on malicious PDFs, not RCE. Revisit when
      #                       pdf-extract bumps lopdf.
      #   RUSTSEC-2026-0194 — quick-xml quadratic run time on duplicate
      #                       attribute names. Transitive via
      #                       wayland-scanner (pins quick-xml ^0.39, can't
      #                       reach >=0.41); build-time XML of trusted
      #                       wayland protocol files only, no direct use in
      #                       src/. Revisit when wayland-scanner bumps it.
      #   (RUSTSEC-2026-0222 was here. It was the only entry with an upstream
      #    fix, held back because the fix needed a newer toolchain than the repo
      #    pinned. V276 moved the pin to 1.98 and wasmtime to 46, so the entry
      #    was DELETED rather than renewed — which is what its own note said to
      #    do the moment the toolchain moved.)
      #   RUSTSEC-2026-0257 — webbrowser: hostile $BROWSER can inject arguments
      #                       into the spawned command (Unix only). Fixed in
      #                       1.2.2, unreachable: transitive via egui-winit
      #                       0.27.2, which pins ^0.8. Needs the egui stack
      #                       upgraded past 0.27 — same blocker as 0192 below.
      #                       DELETE this ignore when that lands (N37).
      #   RUSTSEC-2026-0192 — ttf-parser unmaintained (no safe upgrade;
      #                       transitive via egui/epaint/ab_glyph). DoS-
      #                       class only; cargo-deny denies unmaintained,
      #                       cargo-audit only warns. Revisit when egui
      #                       migrates to skrifa/fontations.
      - name: Run cargo audit
        run: |
          cargo audit \
            --ignore RUSTSEC-2025-0141 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2025-0134 \
            --ignore RUSTSEC-2026-0002 \
            --ignore RUSTSEC-2026-0187 \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195 \
            --ignore RUSTSEC-2026-0192 \
            --ignore RUSTSEC-2026-0257

  feature-matrix:
    name: Feature Matrix (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          # Core features (in "full")
          - "multi-agent"
          - "security"
          - "analytics"
          - "vision"
          - "embeddings"
          - "advanced-streaming"
          - "adapters"
          - "tools"
          - "documents"
          - "eval"
          - "rag"
          - "distributed"
          - "containers"
          - "audio"
          # Autonomous combinations
          - "autonomous"
          - "autonomous,scheduler"
          - "autonomous,butler"
          - "autonomous,browser"
          # Networking (Tier 2)
          - "distributed-network"
          - "distributed-network,p2p"
          - "distributed-network,gpu-sharing"
          - "server-axum"
          - "server-axum,server-axum-tls"
          - "server-axum,server-openapi"
          - "server-axum,eval-suite"
          - "server-axum,distributed-network,server-cluster"
          # Advanced features (Tier 2)
          - "voice-agent"
          - "workflows"
          - "prompt-signatures"
          - "constrained-decoding"
          - "a2a"
          - "hitl"
          - "home-automation,coap"
          - "precise-tokens"
          - "diagnostic-logging"
          - "integrity-check"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: feature-${{ hashFiles('Cargo.lock') }}-${{ strategy.job-index }}
      # V269: these used to run WITHOUT --no-default-features. Since
      # `default = ["full"]`, every entry compiled full + flag — thirty jobs that
      # were near-duplicates of the full build, which is why nothing below `full`
      # was ever exercised and the reduced build rotted until it did not compile
      # (V267). Now each flag is checked on top of the documented minimum, which
      # is what this job always claimed to do.
      #
      # `ai_test_harness --category=feature_matrix` runs the same check locally
      # over EVERY declared flag, reading the list from Cargo.toml so a new flag
      # is covered without anyone remembering to add it here.
      - name: Check ${{ matrix.features }}
        run: cargo check --no-default-features --features "$FEATURES_MIN,${{ matrix.features }}"
      - name: Test ${{ matrix.features }}
        run: cargo test --no-default-features --features "$FEATURES_MIN,${{ matrix.features }}" --lib

  binaries:
    name: Binary Compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Build ai_cli
        run: cargo build --bin ai_cli --features "full,diagnostic-logging"
      - name: Build ai_assistant_cli
        run: cargo build --bin ai_assistant_cli --features "full,butler"
      - name: Build ai_assistant_server
        run: cargo build --bin ai_assistant_server --features "full"
      - name: Build kpkg_tool
        run: cargo build --bin kpkg_tool --features "rag"
      - name: Build ai_test_harness
        run: cargo build --bin ai_test_harness --features "full,browser"

  harness-battery:
    name: Functional Test Battery
    runs-on: ubuntu-latest
    # V154 (#1A): the in-repo `ai_test_harness` runs 585 functional tests
    # across 131 categories. It is NOT cfg-gated like the lib unit tests,
    # so it catches a class of bug the `test` job above structurally
    # cannot — feature-graph breaks (a `dep:X` vs feature `X` drift that
    # disables a code path AND its gated tests at once; see V152), heuristic
    # quality regressions (moderation recall, intent accuracy, token
    # estimation), and panics on real input. The harness exits non-zero on
    # any failure, so this step gates merges.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Build ai_test_harness
        run: cargo build --bin ai_test_harness --features "full,browser"
      - name: Run full battery (585 tests / 131 categories)
        # --all runs every category; --no-color keeps logs clean. Two
        # tests are skipped automatically when Ollama is not reachable
        # (CI has no Ollama), which does not fail the run.
        run: cargo run --bin ai_test_harness --features "full,browser" -- --all --no-color

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Generate coverage
        run: cargo llvm-cov --features "$FEATURES_STD" --lib --lcov --output-path lcov.info
      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: lcov.info
          fail_ci_if_error: false

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    # V126 (C.5): the explicit `bench-budget` step below now gates
    # CI for benchmarks that have a declared budget in
    # bench_budget.toml. The github-action-benchmark "alert" step
    # remains informational (continue-on-error via fail-on-alert: false).
    continue-on-error: false
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Run benchmarks
        id: bench
        # Criterion benches (harness = false). The `--benches` flag is
        # essential: without it, `cargo bench` also runs the lib unit
        # tests (libtest harness), which reject `--output-format` and
        # abort before any criterion bench gets to run.
        # Capture full output to bench_full.log, then filter for the
        # bencher-format rows the github-action-benchmark step expects.
        run: |
          set -o pipefail
          cargo bench --features full --benches -- --output-format bencher 2>&1 \
            | tee bench_full.log \
            | grep -E '^test .* \.\.\. bench:' > output.txt || true
          echo "===== bench_full.log: first 80 lines ====="
          head -80 bench_full.log || true
          echo "===== bench_full.log: last 80 lines ====="
          tail -80 bench_full.log || true
          echo "===== bench_full.log: any line matching 'bench:' ====="
          grep -n 'bench:' bench_full.log | head -20 || true
          echo "===== bench_full.log: any line starting with 'test ' ====="
          grep -nE '^test ' bench_full.log | head -20 || true
          echo "===== output.txt (filtered) ====="
          cat output.txt
          if [ -s output.txt ]; then
            echo "have_output=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_output=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No bencher-format lines captured; upload step will skip."
          fi
      - name: Upload bench log artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bench_full_log
          path: bench_full.log
          if-no-files-found: warn
          retention-days: 7
      - name: Check bench budget (V126 / C.5)
        # Hard gate: any bench listed in bench_budget.toml that
        # exceeds its `max_ns` ceiling fails the CI job. Benches
        # without a budget entry are skipped — the gate is opt-in.
        if: steps.bench.outputs.have_output == 'true'
        run: python3 scripts/check_bench_budget.py --budget bench_budget.toml --output output.txt
      - name: Restore Cargo.lock before branch switch
        # github-action-benchmark below does `git switch gh-pages`,
        # which aborts if Cargo.lock has unstaged changes left by
        # `cargo bench`. Checkout the tree's version back so the
        # switch is clean. Output artifact `output.txt` is gitignored
        # so it survives.
        if: steps.bench.outputs.have_output == 'true'
        run: git checkout -- Cargo.lock
      - name: Store benchmark results
        if: steps.bench.outputs.have_output == 'true'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'cargo'
          output-file-path: output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # 125%: still informational (fail-on-alert: false), but
          # tightened from the previous 200% so a 25% regression
          # surfaces a comment-on-alert without waiting for a 2x
          # blow-up. Real gating now lives in the bench-budget step
          # above.
          alert-threshold: '125%'
          comment-on-alert: true
          fail-on-alert: false
          auto-push: false

  release:
    name: Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, test, clippy, fmt, binaries]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Run full test suite
        run: cargo test --features "$FEATURES_STD" --lib
      - name: Build release
        run: cargo build --release --features "$FEATURES_STD"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
