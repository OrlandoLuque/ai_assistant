name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # V307: crates.io transfer settings. Three CI runs in one night died here, always
  # while fetching the `lance*` tree (lancedb pulls a large one), with exactly two
  # errors: HTTP 503 from index.crates.io, and
  #   "transfer too slow: failed to transfer more than 10 bytes in 30s"
  #
  # That second one is cargo's own `http.low-speed-limit` giving up — 10 bytes/s over
  # 30 s, the default. On a runner sharing bandwidth with everything else on the box
  # that is a hair trigger, and it aborts the whole job over a stall that would have
  # cleared. Raising the window and the retry count costs nothing when the network is
  # fine and removes a failure mode that has nothing to do with the code.
  #
  # A red build whose cause is the registry is worse than a slow one: it trains you to
  # re-run without reading, and the day the failure is real you re-run that too.
  CARGO_NET_RETRY: 10
  CARGO_HTTP_LOW_SPEED_LIMIT: 5
  CARGO_HTTP_TIMEOUT: 120
  # Standard test set — covers core + all lightweight opt-in features
  FEATURES_STD: "full,autonomous,scheduler,butler,browser,distributed-agents,containers,audio,workflows,prompt-signatures,a2a,voice-agent,media-generation,distillation,constrained-decoding,hitl,webrtc,devtools,eval-suite,chaos-testing,local-inference,ffi,tabular,test-utils"
  # Heavy networking features (separate due to quinn/rustls deps)
  FEATURES_NETWORK: "full,distributed-network,p2p,gpu-sharing,server-axum,server-cluster"
  # The smallest set the crate actually builds with (V267). Every other job here
  # starts from `full`, so nothing was ever compiled BELOW it — and the crate had
  # silently stopped building at anything smaller: `prelude` re-exported a
  # `security`-gated module unconditionally, and `server` used an
  # `advanced-streaming`-gated one. Both are the kind of break nobody notices,
  # because nobody compiles that way. This job is what stops it recurring.
  #
  # It is a floor, not an aspiration: these eight are interdependent by design
  # (see the note on `full` in Cargo.toml). Dropping one of them does not
  # currently compile, and that is documented rather than pretended otherwise.
  FEATURES_MIN: "tools,security,advanced-streaming,rag,adapters,analytics,embeddings,documents"

jobs:
  check:
    name: Cargo Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Check (lightweight features)
        run: cargo check --features full
      - name: Check (standard features)
        run: cargo check --features "$FEATURES_STD"
      - name: Check (network features)
        run: cargo check --features "$FEATURES_NETWORK"
      - name: Check (minimum supported features)
        run: cargo check --no-default-features --features "$FEATURES_MIN"
      - name: Check (standard AND network features together)
        # V347. The two sets above were each green and COULD NOT BE COMBINED:
        # `p2p` and `voice_agent` both re-exported an `IceCandidateType` at the
        # crate root, and no job ever turned both on, so the collision was
        # invisible while a consumer enabling both got a library that does not
        # compile. Checking each half of a partition proves nothing about the
        # whole; this step is the one that would have caught it.
        run: cargo check --features "$FEATURES_STD,$FEATURES_NETWORK"

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Run unit tests
        run: cargo test --features "$FEATURES_STD" --lib
      - name: Run integration tests
        run: cargo test --features "$FEATURES_STD" --test '*'
      - name: Run tests (minimum supported features)
        # V343. The `check` job compiles the minimum set but nothing TESTED it,
        # and the two are not the same question: the library built while its
        # test binary did not, because `tests/integration_tests.rs` used
        # `ai_assistant::multi_agent` and `::agent_memory` in ungated modules.
        # Four unresolved imports, invisible for as long as nobody ran the tests
        # down here. `cargo check` passing is what made it look fine.
        run: cargo test --no-default-features --features "$FEATURES_MIN"
      - name: Run doc examples
        # Added V317. Nothing compiled the doc examples before this: `--lib` and
        # `--test '*'` do not touch them, and 17 of 95 had rotted unnoticed --
        # including rag_pipeline's own header, which showed
        # `process(query).await?` against a synchronous five-argument function.
        # A broken example is worse than no example: it is the first thing a
        # reader copies.
        run: cargo test --features "$FEATURES_STD" --doc
      - name: Check doc links
        # Added V335, next to the doc examples because it is the same defect one
        # layer out: V317 caught examples that did not compile, this catches
        # links that point at symbols which do not exist, so they render dead.
        #
        # A ratchet rather than zero: 57 were already there, and demanding zero
        # today would have meant either one enormous commit or no gate at all --
        # and the gate is the part that matters, since one of the 57 was
        # introduced and shipped the same day the rest were found (V332 renamed
        # `default_thread_count` and left the link behind). The count can fall,
        # never rise. FEATURES_STD on purpose: a narrower set checks less code
        # and reports a smaller, untrue number.
        run: python scripts/check_doc_links.py "$FEATURES_STD"

      - name: Check doc imports
        # Added V340, the third layer of the same defect. Three populations of
        # example code exist and only two were checked:
        #   examples/*.rs      -- cargo clippy --all-targets (V247)
        #   `///` doctests     -- cargo test --doc (V317)
        #   ```rust in .md     -- nobody, until now
        # The third is the one a reader meets first: README.md and GUIDE.md open
        # with code blocks. 48 of the 1037 names imported there did not exist at
        # any path, and 38 more existed somewhere other than where the document
        # said -- including two in the README's own front-page example.
        #
        # No feature set: this check is static because there is no usable one.
        # `full` turns on 25 of the 95 features, so compiling reports every type
        # behind the other 70 as missing, and --all-features does not build
        # (vector-lancedb needs protoc). Whether a name is DECLARED does not
        # depend on features; only whether it compiles does.
        run: python3 scripts/check_doc_imports.py

      # The self-test runs first and is not a formality: the first version of this
      # gate PASSED while the README still carried the false completeness claim it
      # was written to refuse, because the pattern meant to catch it had a
      # lookbehind that never matched the capitalisation actually present.
      - name: Self-test the README-numbers gate
        run: python3 scripts/check_readme_numbers.py --self-test

      - name: Check the README's front-page numbers
        # Added V373. Four of the five figures on the front page UNDERSTATED the
        # work (6,095 tests against 8,990; 423K lines against 558K; 61 features
        # against 98) and the fifth claimed the whole tree was complete, which was
        # not stale but false. The README is the first thing anyone reads and
        # nothing checked it. Both directions of drift are the same defect.
        run: python3 scripts/check_readme_numbers.py

      - name: Check the list of checkers is true
        # Added V340. docs/README.md has a section on the automated checks that
        # keep the docs honest, and it had drifted twice: "all three run in CI"
        # until V307 while five did, "all six" until V340 while eight did. A page
        # about enforcement, unenforced. This makes the scripts on disk, the steps
        # in the workflows and that list agree, including the stated total.
        run: python3 scripts/check_checkers_documented.py

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        # -D warnings makes the "zero warnings" rule structural: any rustc or
        # clippy warning fails CI (was -W, i.e. advisory only).
        #
        # V247: extended to --all-targets. It was previously scoped to lib+bins
        # because tests/examples legitimately use the crate's own #[deprecated]
        # items and #[non_exhaustive] configs — but that blind spot let every
        # example and integration test rot: several stopped compiling entirely
        # (renamed APIs, struct literals for #[non_exhaustive] configs) without
        # CI noticing. Those uses now carry scoped #[allow]s where they are
        # deliberate, so the whole tree can be gated.
        run: cargo clippy --features "$FEATURES_STD" --all-targets -- -D warnings
      - name: Run clippy (network features)
        # The `check` / `feature-matrix` jobs COMPILE the network features
        # (server-cluster, p2p, server-axum, gpu-sharing, distributed-network),
        # but `cargo check`/`test` never run clippy, so their lints went ungated
        # and quietly accumulated. These features stay out of FEATURES_STD due to
        # heavy quinn/rustls deps, so lint them here in a dedicated step —
        # --all-targets for the same reason as above.
        run: cargo clippy --features "$FEATURES_NETWORK" --all-targets -- -D warnings
      - name: Run clippy (minimum supported features)
        # Both sets above start from `full`, so nothing was linted BELOW it and
        # the reduced build silently rotted: unconditional uses of `security`-
        # and `advanced-streaming`-gated modules stopped it compiling at all,
        # and three items were dead once their feature was absent. `cargo check`
        # alone would not have caught the latter — they are warnings, not errors.
        run: cargo clippy --no-default-features --features "$FEATURES_MIN" -- -D warnings

  clippy-gui:
    name: Clippy (GUI binaries)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # V415 (N155). NINGUN otro trabajo compila la combinacion `gui,gui-pro`, y
    # eso no es una laguna teorica: la primera vez que se corrio este comando
    # (V409) encontro DOS CONSTANTES MUERTAS EN LA LIBRERIA -- `SHA256_K` y
    # `SHA256_H0`, huerfanas desde que V404 paso SHA-256 a `sha2` dos dias
    # antes. `dead_code` solo las ve con esta combinacion. O sea que las
    # combinaciones sin cubrir no esconden solo deuda de los binarios: esconden
    # deuda de codigo SIEMPRE-COMPILADO que solo una configuracion estrecha
    # alcanza a ver.
    #
    # Y ademas desenterro ~17 lints en los dos binarios, cuatro de ellos
    # `Stroke::new(1.0, ...)` cayendo a `f32`, que el compilador anuncia como
    # **error duro en una version futura**: rotura con fecha puesta por upstream.
    #
    # Trabajo propio y no un cuarto paso del `clippy` de arriba, a proposito: el
    # stack de egui/eframe es pesado y encadenarlo llevaria ese trabajo de ~3 a
    # ~10 minutos, alargando la ejecucion entera. Aqui corre en paralelo. En un
    # repositorio PUBLICO los runners estandar no cuestan minutos, asi que lo
    # unico que se gasta es reloj, y este trabajo cabe a la sombra del mas lento.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Cache propia: este trabajo compila el arbol de egui/eframe, que los
          # demas no tocan. Compartir clave haria que se desalojaran entre si.
          key: clippy-gui
      - name: Lint ai_gui and ai_gui-pro
        run: cargo clippy --features gui,gui-pro --bin ai_gui --bin ai_gui-pro -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check

  deprecation-policy:
    name: Deprecation policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # V127 (C.6): every #[deprecated(...)] attribute in src/ must
    # carry both `since = ` and `note = ` per docs/FEATURE_LIFECYCLE.md.
    # The checker is stdlib-only Python 3.11+ (ubuntu-latest default).
    steps:
      - uses: actions/checkout@v5
      - name: Run deprecation policy checker
        run: python3 scripts/check_deprecation_policy.py --root src

  feature-dep-drift:
    name: Feature/dep drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # V154 (#1B): fail if a feature references `dep:X` while `X` is also a
    # feature gated in src/ via cfg(feature = "X"). That drift silently
    # disables the gated code path (and its tests) — the exact bug that
    # broke AES-256-GCM and PDF parsing until V152. Stdlib-only Python.
    steps:
      - uses: actions/checkout@v5
      - name: Run feature/dep drift checker
        run: python3 scripts/check_feature_dep_drift.py --manifest Cargo.toml --root src

  mutation-specs:
    name: Mutation specs still match the code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # V356: the mutation specs in scripts/mutations/ are `before` strings copied
    # out of source files. The moment one of those lines is edited -- a rename, a
    # `cargo fmt` reflow, a refactor moving a match arm -- the spec stops matching
    # and therefore stops testing anything, silently.
    #
    # Only the --dry-run half runs here: it compiles nothing and takes seconds.
    # The expensive half is one `cargo test` per mutation and stays manual, run
    # when a module or an invariant changes. --self-test proves --dry-run actually
    # fails on each kind of drift, because a gate that has only met good input is
    # not a gate.
    steps:
      - uses: actions/checkout@v5
      - name: The gate proves it discriminates
        run: python3 scripts/mutate.py --self-test
      - name: Every mutation spec still matches its code
        run: python3 scripts/mutate.py --all --dry-run

  openapi-routes:
    name: OpenAPI vs routes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # V302: fail when the embedded server serves a route that /openapi.json does not
    # declare, or declares one it does not serve. The spec is a contract -- it is what a
    # third party generates their client from -- and the failure is silent in one
    # direction: a hidden endpoint never errors, the generated client simply lacks it.
    # V301 found ten such endpoints; this script found eleven.
    steps:
      - uses: actions/checkout@v5
      - name: Run OpenAPI route checker
        run: python3 scripts/check_openapi_routes.py

  documented-cli:
    name: Documented CLI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # V292: fail if docs show an `ai_cli` command line the binary would not accept.
    # A wrong flag does not error — the flag loops end in a catch-all that folds any
    # unrecognised word into the positional argument — so a copy-pasted command
    # "works" and answers a different question. The research guide carried five
    # invented flags, two belonging to another command, and a sub-subcommand that
    # never existed, directly under the words "Copy, paste, run".
    #
    # Only docs/ is checked here: the website lives in its own repository and is
    # covered by running the same script locally with that path.
    steps:
      - uses: actions/checkout@v5
      - name: Run documented-CLI checker
        run: python3 scripts/check_documented_cli.py $(ls docs/*.md | grep -v IMPROVEMENTS_V)

  binaries-documented:
    name: Binary inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # V305: fail when docs/BINARIES.md and Cargo.toml disagree about which binaries
    # exist. The page opens by calling itself "the authoritative inventory of every
    # executable binary shipped by the crate" and had been listing 26 of 41 — asked
    # "does that binary exist?", it answered a confident no for fifteen of them.
    # Also fails on a row linking to a page that is not there, so the inventory
    # cannot be completed by pointing at files that do not exist.
    steps:
      - uses: actions/checkout@v5
      - name: Run binary-inventory checker
        run: python3 scripts/check_binaries_documented.py

  duplicate-types:
    name: Duplicate type names
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # V362: fail when a NEW enum name is declared twice with different variants.
    # Measured on 2026-10-01: 215 duplicated type names, of which 35 are divergent
    # enums. Every one of them was found by accident while looking for something
    # else — three RRF implementations where the V316 fix reached one (N99), three
    # LLM-as-a-judge implementations wired to nothing, and `StepStatus` where the
    # `agent_graph` copy cannot express "blocked" at all.
    #
    # The ratchet freezes those 35 in [untriaged] and refuses a 36th. It does NOT
    # bless them: [untriaged] says in the file that nobody judged them, which is
    # why it is a separate section from [allowed] — an exemption with an invented
    # reason reads as reviewed and then nobody re-reads it.
    steps:
      - uses: actions/checkout@v5
      # The self-test runs first and is not a formality: it caught a comma inside a
      # doc comment splitting the variant list, which made a four-variant enum read
      # as zero and invented a divergence between two identical enums.
      - name: Self-test the duplicate-type scanner
        run: python3 scripts/check_duplicate_types.py --self-test
      - name: Run duplicate-type ratchet
        run: python3 scripts/check_duplicate_types.py

  config-constructible:
    name: Configs buildable from outside
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # V446: fail when a `#[non_exhaustive]` struct that a public function takes as
    # an argument cannot be configured from another crate in ONE expression.
    #
    # Measured with two throwaway crates (2026-10-27), because the first version of
    # this gate was written on a belief: `#[non_exhaustive]` rejects the struct
    # expression, `..Default::default()` included (error[E0639]), and does NOT
    # reject assigning to a `pub` field of a value you own. So with a `Default` the
    # consumer was not locked out --- they were pushed into a `mut` binding and one
    # statement per field, and could not build one in argument position.
    #
    # Two classes, kept apart on purpose: NO_SEED is the hard lockout (nothing
    # returns a value, `MockHttpServer` before N159), MISSING is the awkward one
    # (`VectorDbConfig.dimensions` before N160). 174 of 316 were in one or the
    # other.
    #
    # Unit tests cannot see any of this: `#[non_exhaustive]` does not apply inside
    # the declaring crate, so they build these with a literal and pass. That is why
    # it is a gate and not a test.
    #
    # It also checks COVERAGE --- every public field needs a setter --- which is the
    # half that stops the next one: a config that grows a field without growing its
    # setter is a silent hole that only a consumer finds.
    steps:
      - uses: actions/checkout@v5
      # The self-test first: its cases include an `impl` indented inside a module
      # (a `^impl` regex reported 7 types as having no `Default` while
      # `impl Default for VadConfig` sat four spaces in) and a field whose type
      # contains `->`.
      - name: Self-test the constructibility scanner
        run: python3 scripts/check_config_constructible.py --self-test
      - name: Check every input config can be built
        run: python3 scripts/check_config_constructible.py

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Two files decide which advisories are suppressed -- deny.toml for
      # `cargo deny`, the --ignore flags below for `cargo audit` -- and nothing
      # kept them in step. An advisory silenced in one and enforced in the other
      # means which gate catches it depends on which tool runs, which is the
      # same as not knowing. This also refuses an entry with no reason written
      # above it: a suppression is a claim that the advisory cannot reach our
      # usage, and a claim with no argument is not reviewable.
      - name: Check the two RUSTSEC ignore lists agree
        run: python3 scripts/check_rustsec_ignores.py

      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: cargo-audit
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      # Las 16 supresiones y POR QUE cada una no nos alcanza viven en `deny.toml`,
      # que es la UNICA fuente: ahi estan las mediciones, con fecha, y la linea
      # `Re-check by:` que `scripts/check_recheck_dates.py` hace cumplir. Aqui no
      # se repiten: solo se nombran, para saber de que va cada flag sin abrir el
      # otro fichero.
      #
      # Se repetian, y es exactamente lo que fallo. El 2026-11-03, al anadir la
      # cuarta de `zip`, resulto que cuatro de los bloques de prosa de aqui
      # decian cosas que `deny.toml` ya habia medido como FALSAS el 2026-10-13:
      #
      #   * la frase de cabecera, «all live in transitive dependencies that
      #     cannot be bumped»: TRES de esos crates los declaramos nosotros
      #     (bincode 1, rustls-pemfile, zip), asi que no hay nadie arriba que
      #     nos este bloqueando;
      #   * 0141 y 0134 marcados «(transitive)»: los dos son nuestros;
      #   * 0194 y 0195 culpaban a la cadena de wayland-scanner y a «XML de
      #     build-time de ficheros de protocolo de confianza», cuando el crate
      #     entra por nuestro `tabular-polars` via `object_store` con `cloud` y
      #     `http` --- o sea XML que llega por la red;
      #   * 0192 ataba su revision a «cuando egui migre a skrifa/fontations»,
      #     teniendo DOS raices independientes (lopdf y egui), asi que la
      #     condicion no podia cumplirse nunca.
      #
      # Y las cuatro seguian pareciendo revisadas, que es la regla 7 del
      # modus-operandi. Dos copias de una razon son una razon y un pasivo: la
      # misma leccion que el bloque de shell que comparaba las tres listas en
      # paralelo a `check_rustsec_ignores.py` y que se borro por esto mismo.
      #
      # El indice, en el mismo orden que los flags de abajo:
      #   RUSTSEC-2025-0141  bincode 1.3.3 sin mantenimiento (declarado por nosotros)
      #   RUSTSEC-2024-0436  paste sin mantenimiento (22 dependientes, egui no)
      #   RUSTSEC-2025-0134  rustls-pemfile sin mantenimiento (declarado por nosotros)
      #   RUSTSEC-2026-0002  lru: `IterMut` unsound (transitiva, tantivy/lance)
      #   RUSTSEC-2026-0253  lru: use-after-free por panico en `pop()` (idem)
      #   RUSTSEC-2026-0194  quick-xml: tiempo cuadratico en atributos duplicados
      #   RUSTSEC-2026-0195  quick-xml: asignacion ilimitada de namespaces
      #   RUSTSEC-2026-0192  ttf-parser sin mantenimiento (dos raices: lopdf y egui)
      #   RUSTSEC-2026-0367  zip: conserva los bits SUID/SGID al extraer
      #   RUSTSEC-2026-0368  zip: symlinks fuera del destino al extraer
      #   RUSTSEC-2026-0369  zip: permisos aplicados a traves de un symlink
      #   RUSTSEC-2026-0429  zip: abort del proceso por el tamano de un symlink
      #   RUSTSEC-2026-0257  webbrowser: inyeccion de argumentos via BROWSER
      #
      # Seis que ESTUVIERON aqui y se borraron, para que nadie las reponga:
      # RUSTSEC-2026-0187 (lopdf, V355), RUSTSEC-2026-0222 (wasmtime, V276) y
      # las cuatro de la familia zstd --- 0391, 0398, 0403, 0410 --- en V451.
      # Todas se fueron porque su bloqueo se levanto, y una entrada asi se
      # BORRA, no se renueva. Las cuatro de wasmtime del 2026-10-29 no llegaron
      # a entrar por lo mismo: el parche cabia en `^49.0.2` (V449).
      #
      # Las de zstd merecen una linea aparte porque llevaban tres semanas y su
      # razon escrita decia que el arreglo "NO es alcanzable, y esto se PROBO".
      # Se probo de verdad, con `--precise 0.14.3`, y fallo de verdad. Lo que no
      # se miro es que esos advisories declaran DOS rangos parcheados: `^0.13.4`
      # y `^7.4.0` cabian dentro de los anclajes existentes. Al leer un
      # advisory, `patched` es una LISTA.
      #
      # Y los tres `-D` del final del comando son V452. Hasta ese dia este paso
      # llevaba SOLO `--ignore`, sin un `-D`, asi que las informacionales
      # (`unsound`, `yanked`, `unmaintained`) no hacian fallar nada NUNCA: el
      # 2026-11-13 se tragaba DIECISEIS, y una de ellas --- RUSTSEC-2026-0442,
      # una lectura fuera de limites en arrow-data --- llevaba once dias
      # invisible con un arreglo de parche disponible. V451 arreglo quince con
      # seis `cargo update` y la que quedaba quedo suprimida con su razon, asi
      # que denegar ya no significa pintar de rojo lo que nadie puede arreglar:
      # significa que la proxima informacional se ve el dia que aparece.
      - name: Run cargo audit
        run: |
          cargo audit \
            --ignore RUSTSEC-2025-0141 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2025-0134 \
            --ignore RUSTSEC-2026-0002 \
            --ignore RUSTSEC-2026-0253 \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195 \
            --ignore RUSTSEC-2026-0192 \
            --ignore RUSTSEC-2026-0367 \
            --ignore RUSTSEC-2026-0368 \
            --ignore RUSTSEC-2026-0369 \
            --ignore RUSTSEC-2026-0429 \
            --ignore RUSTSEC-2026-0257 \
            -D unsound \
            -D yanked \
            -D unmaintained

  # The expensive tabular engine, on its own because it drags 397 crates and
  # 49.3 MiB (measured). Putting it in FEATURES_STD would slow every other job
  # for a feature most builds will never enable.
  #
  # And it is here at all because `tabular` was in NEITHER feature set when it
  # was written: `full` does not include it and this file did not mention it, so
  # 45 tests ran on one laptop and nowhere else. That is the standing hazard this
  # repository already knows about — 27 declared features no CI job compiled —
  # and the fix is to add the job when the feature lands, not later.
  tabular-polars:
    name: Tabular — Polars engine and cross-engine agreement
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: tabular-polars
      # Both engines, so `tabular::both_engines_agree` is compiled at all. Those
      # three tests exist only when both features are on, and they are the ones
      # that would catch the two backends disagreeing.
      - name: Test both engines
        run: cargo test --features "tabular,tabular-polars" --lib tabular
      # `--lib --tests` and not `--lib`: V358 wrote six pieces of dead code into
      # this module's TEST module, reachable only in a Polars-only build, and this
      # job — the only one that compiles that combination — could not see them,
      # because `--lib` does not compile `#[cfg(test)]`. Every other clippy step in
      # this file uses `--all-targets` for exactly that reason (two examples had
      # rotted before anyone noticed).
      #
      # `--lib --tests` rather than `--all-targets`: examples and benches never
      # mention `tabular`, and building them against the 397-crate Polars graph
      # would cost minutes to check nothing.
      - name: Clippy, both engines
        run: cargo clippy --features "tabular,tabular-polars" --lib --tests -- -D warnings
      # Each engine alone must also build: enabling only `tabular-polars` once
      # compiled NO module at all, because the umbrella feature always drags
      # SQLite in and the gate read `cfg(feature = "tabular")`. A silent nothing,
      # not an error.
      #
      # `check --lib` and NOT `clippy --lib --tests`, and this is load-bearing:
      # measured 2026-09-27, adding `--tests` here produces **109 compile errors**,
      # none of them in `tabular` — `unresolved import crate::mcp_protocol` and
      # `crate::websocket_streaming` out of `src/server.rs` (82), `src/lib.rs` (25)
      # and `src/assistant/mod.rs` (24). That is N79: with narrow features the
      # LIBRARY compiles and its TESTS do not, because test code reaches for
      # modules gated behind features the narrow set does not enable.
      #
      # So these two steps deliberately ask the smaller question, and the reason is
      # written here rather than left to be rediscovered: I upgraded them to
      # `--tests` in V358 believing the `--lib` was an oversight, and turned CI red
      # on a pre-existing condition that has its own task.
      #
      # UPGRADE THESE TO `clippy --lib --tests -- -D warnings` when N79 lands. The
      # gap they leave meanwhile is covered by the both-engines clippy above, which
      # does compile `#[cfg(test)]`.
      - name: SQLite engine alone
        run: cargo check --no-default-features --features "tabular" --lib
      - name: Polars engine alone
        run: cargo check --no-default-features --features "tabular-polars" --lib

  skill-forge:
    name: Skill Forge - el unico camino a wasmtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # V454. `skill-forge` es la UNICA feature que mete wasmtime, y hasta hoy
    # ningun trabajo de este fichero la encendia: `grep -c skill-forge ci.yml`
    # daba 0, y no hay un solo `--all-features` en ningun workflow.
    #
    # Eso ya costo algo concreto, no hipotetico: V449 subio wasmtime 49.0.4 ->
    # 49.0.5 para arreglar CUATRO advisories y CI no pudo confirmar el bump ---
    # se verifico a mano, en una maquina. Un arreglo de seguridad cuya
    # compilacion depende de que alguien se acuerde de ejecutar un comando no
    # esta verificado: esta recordado.
    #
    # COSTE MEDIDO (2026-11-13, `cargo tree --offline -e normal` contra `full`):
    # +72 cajas y +9,7 MiB de `.crate`. Es la MITAD del trabajo
    # `tabular-polars` de arriba, que ya se paga en cada ejecucion (+140 cajas,
    # +20,4 MiB) --- y cuyo propio comentario dice justo lo que faltaba aqui:
    # el arreglo es anadir el trabajo cuando la feature entra, no despues.
    # El tiempo de pared NO lo predicen las cajas --- las 72 son el mundo de
    # cranelift, cuyo build script genera codigo ISLE --- asi que se midio con
    # la primera ejecucion: 106 s (V454b), y 1 min 39 s el 2026-11-15. Esta
    # nota seguia diciendo "no esta medido" dos noches despues de estarlo;
    # corregido en V457b.
    #
    # `--lib` y sin tests, a proposito: la pregunta que este trabajo contesta es
    # "compila wasmtime", que es la que estaba sin contestar, y es exactamente
    # el comando que se corria a mano. Pasar a
    # `cargo test --features skill-forge --lib skill_forge` contesta otra
    # ("se prueba"), cuesta mas minutos y es decision del autor.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: skill-forge
      - name: Compile the WASM skill engine
        run: cargo check --features skill-forge --lib

  uncovered-features:
    name: Las once que no compilaba nadie
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # V457. Estas once features estaban en `UNCOVERED_BACKLOG`
    # (`src/bin/ai_test_harness/feature_matrix.rs`): declaradas en `Cargo.toml`,
    # ocho de ellas anunciadas en el README, y compiladas por NINGUN trabajo de
    # este fichero. Lo que habia detras, contado antes de escribir el trabajo
    # (2026-11-15, 0.2.419): 14.073 lineas, 277 tests que no ejecutaba nadie, y
    # cinco binarios mas un ejemplo que no compilaba ningun trabajo --- los cinco
    # binarios estan inventariados en `docs/BINARIES.md`, pagina que CI verifica
    # contra el manifiesto desde V305.
    #
    # DOS de las once estaban rotuladas de imposibles y no lo eran:
    # `hardware-rocm` y `hardware-metal` figuraban bajo «the Linux runner cannot
    # build these at all» y no declaran una sola dependencia. Sus bloques son
    # Rust puro que invoca `rocm-smi` / `system_profiler` por `Command`; el de
    # Metal comprueba macOS en EJECUCION, con `cfg!`. Lo decia ya el comentario
    # de `hardware-detection` en `Cargo.toml`. Eran las dos mas baratas de la
    # lista.
    #
    # UNA FEATURE POR PASO, no las once en un `--features`. Once juntas son UNA
    # compilacion: si `a` sola no compila porque le falta un `#[cfg]` que `b` le
    # proporciona, esa compilacion sale verde y el agujero sigue ahi. Es el
    # mismo razonamiento que ya esta escrito para `ffi,vision` en la matriz de
    # abajo y para los dos motores de `tabular` mas arriba.
    #
    # Y UN SOLO TRABAJO, no once entradas de matriz: cada entrada de matriz es
    # un runner entero --- checkout, toolchain, cache y una compilacion de
    # FEATURES_MIN completa --- y este fichero ya desplegaba 22 trabajos (23 con este) mas 38
    # entradas de matriz. Aqui las dependencias se compilan una vez y cada paso recompila
    # solo nuestro crate.
    #
    # `cargo test --lib`, no `cargo check`: «lo compila alguien» y «lo prueba
    # alguien» son dos preguntas distintas y el trinquete las separa en dos
    # listas. Con `check` las once solo se mudarian de lista y los 277 tests
    # seguirian sin ejecutarse.
    #
    # COSTE MEDIDO. En el runner, primera ejecucion y por tanto a cache frio:
    # 14 min 18 s, los dieciseis pasos en verde (ejecucion 43660293902,
    # 2026-11-15). En la maquina de desarrollo, con las dependencias ya
    # compiladas: ~70 s por feature y 21 s por paso de binarios, 14 min 42 s.
    # Las dos cifras miden cosas distintas y coinciden por casualidad.
    #
    # Y la SEGUNDA ejecucion, con la cache ya caliente, tardo 17 min 10 s ---
    # MAS que la primera a frio. O sea que aqui la varianza del runner domina
    # sobre la cache, y el presupuesto honesto de este trabajo son 14-17 min,
    # no 14. Sigue holgado contra el timeout de 30, que es lo que habia que
    # decidir, pero una sola muestra lo habria dejado subestimado un 20 %.
    #
    # V458 le anade el paso de `clippy`. Y el runner corrigio las dos cifras que
    # V458 escribio para el:
    #
    # - El paso de clippy tarda **32 s** alli, no 48 (ejecucion 43748766793).
    # - El trabajo COMPLETO, con el paso nuevo dentro, tardo **10 min 42 s** ---
    #   por DEBAJO del rango «14-17 min» de arriba, teniendo un paso mas.
    #
    # Cuatro muestras del mismo trabajo: 10:42, 14:18, 15:02 y 17:10. O sea que
    # «14-17 min» no era un rango estrecho por arriba: estaba mal por abajo, y la
    # cuarta muestra es la mas rapida de las cuatro aun haciendo mas trabajo.
    # Descompuesto: ~10:40 es el suelo (cache caliente y runner tranquilo), el
    # arbol de dependencias a frio anade ~3,5 min, y un runner con vecinos
    # ruidosos anade hasta ~6 min.
    #
    # La conclusion practica, que es la unica que hay que mantener: el peor caso
    # observado son 17 min contra `timeout-minutes: 30`. Un tiempo de pared en un
    # runner compartido es una distribucion, no un numero, y publicarlo como
    # rango estrecho invita a ajustar el timeout contra el. Con cuatro muestras la
    # dispersion es del 60 %.
    #
    # Los once pasos tardan 44-48 s cada uno en el runner --- uniformes, y mas
    # rapidos que en la maquina de desarrollo (64-81 s por feature, compilacion
    # mas ejecucion). Los binarios, 83 s.
    #
    # Y el runner contesto lo que aqui no se podia: `hardware-rocm` y
    # `hardware-metal` compilan y pasan en ubuntu. De paso dieron CUATRO tests
    # menos que en Windows, con motivo medido: el bloque
    # `target_os = "windows"` de `src/hardware_info.rs:670` tiene 4 tests y el
    # de `target_os = "linux"` (:806) no tiene NINGUNO. La sonda de hardware
    # de la plataforma en la que corre CI no esta probada --- anotado en V457b,
    # no arreglado.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: uncovered-features
      # Las seis sin dependencias propias van primero: son las mas baratas y
      # las que fallarian antes.
      - name: vector-pgvector
        run: cargo test --no-default-features --features "$FEATURES_MIN,vector-pgvector" --lib
      - name: prompt-fragments
        run: cargo test --no-default-features --features "$FEATURES_MIN,prompt-fragments" --lib
      - name: acp
        run: cargo test --no-default-features --features "$FEATURES_MIN,acp" --lib
      - name: hardware-rocm
        run: cargo test --no-default-features --features "$FEATURES_MIN,hardware-rocm" --lib
      - name: hardware-metal
        run: cargo test --no-default-features --features "$FEATURES_MIN,hardware-metal" --lib
      - name: prompt-breeder
        run: cargo test --no-default-features --features "$FEATURES_MIN,prompt-breeder" --lib
      # Estas cinco encienden paraguas que FEATURES_MIN no trae: `multi-agent`,
      # `advanced-memory`, `distillation`, `autonomous` y `audio`. Por eso la
      # medicion de «+0 cajas» hecha sobre `full` no decia nada de este trabajo.
      - name: sub-agents
        run: cargo test --no-default-features --features "$FEATURES_MIN,sub-agents" --lib
      - name: prompt-synthesis
        run: cargo test --no-default-features --features "$FEATURES_MIN,prompt-synthesis" --lib
      - name: feedback-loop
        run: cargo test --no-default-features --features "$FEATURES_MIN,feedback-loop" --lib
      - name: stall-detection
        run: cargo test --no-default-features --features "$FEATURES_MIN,stall-detection" --lib
      - name: stall-detection-llm
        run: cargo test --no-default-features --features "$FEATURES_MIN,stall-detection-llm" --lib
      # Los pasos de arriba compilan la libreria en modo test, donde un import
      # que solo usa `#[cfg(test)]` cuenta como usado. Estos la compilan SIN
      # `cfg(test)`, que es como se vieron por primera vez tres imports muertos
      # en `src/prompt_breeder/breeder.rs` (arreglados en V457). Y de paso
      # compilan los targets que nada compilaba.
      - name: Los binarios y el ejemplo que nada compilaba
        run: |
          cargo check --no-default-features --features "$FEATURES_MIN,acp" --bin ai_acp --bin ai_acp_audit
          cargo check --no-default-features --features "$FEATURES_MIN,prompt-synthesis" --bin ai_prompt_synth
          cargo check --no-default-features --features "$FEATURES_MIN,feedback-loop" --bin ai_feedback
          cargo check --no-default-features --features "$FEATURES_MIN,prompt-breeder" --bin ai_breeder
          cargo check --no-default-features --features "$FEATURES_MIN,vector-pgvector" --example vector_pgvector_demo
      # V458. Los tres pasos de `clippy` de este fichero (lineas ~155-191)
      # corren sobre `FEATURES_STD`, `FEATURES_NETWORK` y `FEATURES_MIN`, y
      # NINGUNA de estas once esta en `full` --- comprobado una por una en
      # `Cargo.toml`. O sea que las 14.073 lineas que V457 trajo a CI entraron
      # con CERO lints: compiladas y probadas, pero nunca mas miradas que eso.
      #
      # Al escribir este paso salieron SEIS warnings en codigo que ningun lint
      # habia visto nunca: dos `unnecessary_unwrap` en
      # `src/prompt_breeder/eval.rs`, un `unnecessary_sort_by` en
      # `src/prompt_synthesis/intent.rs` y tres en codigo de test (`len_zero`
      # dos veces y un `bool_assert_comparison`). Uno de ellos apuntaba a una
      # asercion vacua, y tirando de ahi salio que la poda de `tick_and_prune`
      # elegia al revES de lo que prometia su propio comentario. Las dos cosas
      # arregladas en V458.
      #
      # UN SOLO PASO con las once juntas --- y aqui si, al contrario que en los
      # pasos de `cargo test` de arriba. La diferencia: alli la pregunta es si
      # cada feature COMPILA sola, y once juntas la contestan en falso, porque
      # lo que a una le falta otra se lo da. Aqui la pregunta es si este codigo
      # tiene warnings, y con las once encendidas se ve el codigo de las once.
      # Medido: 48 s juntas en la maquina de desarrollo y 32 s en el runner,
      # contra ~7 min repartido en once pasos --- extrapolacion de UNA medicion,
      # 38,9 s para `prompt-breeder` sola con `--all-targets`, no de las once.
      #
      # EL LIMITE, escrito para que nadie lo lea como mas de lo que es: un lint
      # que solo salta con UNA de las once encendida --- un `use` que sobra
      # cuando el codigo que lo necesitaba esta apagado --- no salta aqui. El
      # extremo de «todas apagadas» lo cubre el paso
      # `clippy (minimum supported features)` de arriba, este cubre el de
      # «todas encendidas», y las combinaciones de en medio no las cubre nadie
      # ni hay presupuesto que las cubra.
      #
      # `--all-targets` y no `--lib`: es lo que alcanza el codigo de test ---
      # tres de los seis warnings estaban ahi --- y, verificado contra
      # `--message-format=json`, tambien los cinco binarios y el ejemplo que el
      # paso de arriba compila sin lints (`ai_acp`, `ai_acp_audit`, `ai_breeder`,
      # `ai_feedback`, `ai_prompt_synth`, `vector_pgvector_demo`). Ese paso se
      # queda igualmente, porque los compila UNA FEATURE A LA VEZ, que es la
      # otra pregunta.
      - name: clippy sobre las once (-D warnings)
        run: cargo clippy --no-default-features --features "$FEATURES_MIN,vector-pgvector,prompt-fragments,acp,hardware-rocm,hardware-metal,prompt-breeder,sub-agents,prompt-synthesis,feedback-loop,stall-detection,stall-detection-llm" --all-targets -- -D warnings

  feature-matrix:
    name: Feature Matrix (${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        features:
          # Core features (in "full")
          - "multi-agent"
          - "security"
          - "analytics"
          - "vision"
          - "embeddings"
          - "advanced-streaming"
          - "adapters"
          - "tools"
          - "documents"
          - "eval"
          - "rag"
          - "distributed"
          - "containers"
          - "audio"
          # V330: `local-inference` declares no extra dependencies — the umbrella
          # is just the `Backend` trait plus the stub. Only its two concrete
          # backends (`-candle`, `-llama-cpp`) pull heavy native deps, and
          # `-llama-cpp` additionally needs libclang, which is why they stay out
          # of CI. Excluding the umbrella too bought nothing and meant the
          # `LlmProvider` bridge added in V330 compiled on no CI job at all.
          - "local-inference"
          # Autonomous combinations
          - "autonomous"
          - "autonomous,scheduler"
          - "autonomous,butler"
          - "autonomous,browser"
          # Networking (Tier 2)
          - "distributed-network"
          - "distributed-network,p2p"
          - "distributed-network,gpu-sharing"
          - "server-axum"
          - "server-axum,server-axum-tls"
          - "server-axum,server-openapi"
          - "server-axum,eval-suite"
          - "server-axum,distributed-network,server-cluster"
          # Advanced features (Tier 2)
          - "voice-agent"
          - "workflows"
          - "prompt-signatures"
          - "constrained-decoding"
          - "a2a"
          - "hitl"
          - "home-automation,coap"
          - "precise-tokens"
          - "diagnostic-logging"
          - "integrity-check"
          # V342. `ffi` was excluded with the reason "produces cdylib/staticlib
          # only; nothing to type-check beyond the lib". That is false: the
          # feature gates src/ffi.rs, 1607 lines behind `#[cfg(feature = "ffi")]`,
          # and it had been sitting on two compile errors -- a `Vec<u8>` passed
          # where `&[u8]` was wanted, and a read of `AiConfig::system_prompt`,
          # a field that does not exist. An argued suppression whose argument is
          # wrong is the worst kind, because nobody re-reads it.
          #
          # `vision` on purpose: the broken lines are in
          # `ai_assistant_send_message_with_image`, which is `#[cfg]`-gated on
          # `vision` inside the `ffi` module, so `ffi` alone would not compile
          # them and the job would go green over the same hole.
          - "ffi,vision"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: feature-${{ hashFiles('Cargo.lock') }}-${{ strategy.job-index }}
      # V269: these used to run WITHOUT --no-default-features. Since
      # `default = ["full"]`, every entry compiled full + flag — thirty jobs that
      # were near-duplicates of the full build, which is why nothing below `full`
      # was ever exercised and the reduced build rotted until it did not compile
      # (V267). Now each flag is checked on top of the documented minimum, which
      # is what this job always claimed to do.
      #
      # `ai_test_harness --category=feature_matrix` runs the same check locally
      # over EVERY declared flag, reading the list from Cargo.toml so a new flag
      # is covered without anyone remembering to add it here.
      - name: Check ${{ matrix.features }}
        run: cargo check --no-default-features --features "$FEATURES_MIN,${{ matrix.features }}"
      - name: Test ${{ matrix.features }}
        run: cargo test --no-default-features --features "$FEATURES_MIN,${{ matrix.features }}" --lib

  binaries:
    name: Binary Compilation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Build ai_cli
        run: cargo build --bin ai_cli --features "full,diagnostic-logging"
      - name: Build ai_assistant_cli
        run: cargo build --bin ai_assistant_cli --features "full,butler"
      - name: Build ai_assistant_server
        run: cargo build --bin ai_assistant_server --features "full"
      - name: Build kpkg_tool
        run: cargo build --bin kpkg_tool --features "rag"
      - name: Build ai_test_harness
        run: cargo build --bin ai_test_harness --features "full,browser"

  harness-battery:
    name: Functional Test Battery
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # V154 (#1A): the in-repo `ai_test_harness` runs 585 functional tests
    # across 131 categories. It is NOT cfg-gated like the lib unit tests,
    # so it catches a class of bug the `test` job above structurally
    # cannot — feature-graph breaks (a `dep:X` vs feature `X` drift that
    # disables a code path AND its gated tests at once; see V152), heuristic
    # quality regressions (moderation recall, intent accuracy, token
    # estimation), and panics on real input. The harness exits non-zero on
    # any failure, so this step gates merges.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Build ai_test_harness
        run: cargo build --bin ai_test_harness --features "full,browser"
      # V439: la puerta de cobertura de features existia desde V313 y NUNCA
      # corria en CI --- solo dentro de la bateria, que se lanza a mano. Cuando
      # por fin se ejecuto estaba ROJA, y por un motivo falso: su analizador no
      # leia los `--features` de las lineas `run:` ni seguia el grafo de
      # Cargo.toml, asi que acusaba a `tabular-polars` de no compilarse mientras
      # un trabajo lo estaba probando.
      #
      # Va antes de la bateria y en este trabajo porque el binario ya esta
      # compilado aqui: el paso cuesta segundos. Y va primero porque falla en
      # milisegundos, asi que no tiene sentido esperar a los 585 tests.
      - name: Feature coverage ratchet
        run: cargo test --bin ai_test_harness --features "full,browser" -- feature_matrix::tests
      - name: Run full battery (585 tests / 131 categories)
        # --all runs every category; --no-color keeps logs clean. Two
        # tests are skipped automatically when Ollama is not reachable
        # (CI has no Ollama), which does not fail the run.
        run: cargo run --bin ai_test_harness --features "full,browser" -- --all --no-color

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Generate coverage
        run: cargo llvm-cov --features "$FEATURES_STD" --lib --lcov --output-path lcov.info
      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: lcov.info
          fail_ci_if_error: false

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event_name == 'push'
    # V126 (C.5): the explicit `bench-budget` step below now gates
    # CI for benchmarks that have a declared budget in
    # bench_budget.toml. The github-action-benchmark "alert" step
    # remains informational (continue-on-error via fail-on-alert: false).
    continue-on-error: false
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Run benchmarks
        id: bench
        # Criterion benches (harness = false). The `--benches` flag is
        # essential: without it, `cargo bench` also runs the lib unit
        # tests (libtest harness), which reject `--output-format` and
        # abort before any criterion bench gets to run.
        # Capture full output to bench_full.log, then filter for the
        # bencher-format rows the github-action-benchmark step expects.
        run: |
          set -o pipefail
          cargo bench --features full --benches -- --output-format bencher 2>&1 \
            | tee bench_full.log \
            | grep -E '^test .* \.\.\. bench:' > output.txt || true
          echo "===== bench_full.log: first 80 lines ====="
          head -80 bench_full.log || true
          echo "===== bench_full.log: last 80 lines ====="
          tail -80 bench_full.log || true
          echo "===== bench_full.log: any line matching 'bench:' ====="
          grep -n 'bench:' bench_full.log | head -20 || true
          echo "===== bench_full.log: any line starting with 'test ' ====="
          grep -nE '^test ' bench_full.log | head -20 || true
          echo "===== output.txt (filtered) ====="
          cat output.txt
          if [ -s output.txt ]; then
            echo "have_output=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_output=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No bencher-format lines captured; upload step will skip."
          fi
      - name: Upload bench log artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bench_full_log
          path: bench_full.log
          if-no-files-found: warn
          retention-days: 7
      - name: Check bench budget (V126 / C.5)
        # Hard gate: any bench listed in bench_budget.toml that
        # exceeds its `max_ns` ceiling fails the CI job. Benches
        # without a budget entry are skipped — the gate is opt-in.
        if: steps.bench.outputs.have_output == 'true'
        run: python3 scripts/check_bench_budget.py --budget bench_budget.toml --output output.txt
      - name: Restore Cargo.lock before branch switch
        # github-action-benchmark below does `git switch gh-pages`,
        # which aborts if Cargo.lock has unstaged changes left by
        # `cargo bench`. Checkout the tree's version back so the
        # switch is clean. Output artifact `output.txt` is gitignored
        # so it survives.
        if: steps.bench.outputs.have_output == 'true'
        run: git checkout -- Cargo.lock
      - name: Store benchmark results
        if: steps.bench.outputs.have_output == 'true'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'cargo'
          output-file-path: output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # 125%: still informational (fail-on-alert: false), but
          # tightened from the previous 200% so a 25% regression
          # surfaces a comment-on-alert without waiting for a 2x
          # blow-up. Real gating now lives in the bench-budget step
          # above.
          alert-threshold: '125%'
          comment-on-alert: true
          fail-on-alert: false
          auto-push: false

  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, test, clippy, fmt, binaries]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Run full test suite
        run: cargo test --features "$FEATURES_STD" --lib
      - name: Build release
        run: cargo build --release --features "$FEATURES_STD"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
