name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: |
      (github.event_name == 'pull_request_target') ||
      (github.event_name == 'issue_comment' && github.event.comment.body == 'recheck')
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/${{ github.repository }}/blob/master/CLA.md'
          branch: 'cla-signatures'
          allowlist: OrlandoLuque
          custom-notsigned-prcomment: |
            Thank you for your contribution! Before we can merge this PR,
            you need to sign our [Contributor Assignment Agreement (CLA)](https://github.com/${{ github.repository }}/blob/master/CLA.md).

            To sign, please add a comment to this PR stating:

            > I have read the CLA and I agree to its terms.
          custom-pr-sign-comment: 'I have read the CLA and I agree to its terms.'
