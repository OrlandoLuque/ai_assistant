# cargo-deny configuration — V125 (C.1 supply chain)
#
# Three concerns:
#   * advisories — RustSec security database (cargo-audit overlap, but
#     cargo-deny applies the same rules to the full lock graph in one
#     pass, and supports more granular allow/deny lists).
#   * licenses   — block GPL family + AGPL + SSPL (PolyForm
#     Noncommercial 1.0.0 is incompatible with copyleft, so a single
#     GPL transitive contaminates a future commercial dual-license).
#   * bans       — keep the dep graph clean: no duplicates above
#     tolerance, no wildcard versions, no specific known-bad crates.

[graph]
# V385 (N146) — this MUST stay `true`, and the reason is a measurement.
# Taken 2026-10-10 with `cargo tree -e no-dev --target all`:
#
#   default feature graph ....  299 crates   <- all this file used to check
#   every feature ............  955 crates
#   never checked ............  656 crates   (69 % of the tree)
#
# With 95 feature flags, nearly everything this crate depends on sits behind
# one of them. The header above states what this file exists to prevent: "a
# single GPL transitive contaminates a future commercial dual-license". A
# copyleft crate behind ANY optional feature — rag, distributed, gui-pro —
# was invisible, and `licenses ok` came back true: true, and much smaller
# than the question it looked like it was answering.
#
# What gave it away: six of the eight `[advisories].ignore` entries warned
# `advisory-not-detected`. They were NOT stale. Five of the six are live
# advisories on crates outside the default graph (webbrowser, paste,
# rustls-pemfile, quick-xml, wayland-scanner), and the two that WERE detected
# — bincode, ttf-parser — are the two crates inside it. Six against two with
# no overlap is a mechanism, not a coincidence.
#
# Widening it also made four `exceptions` below start working: epaint (the OFL
# / Ubuntu-Font assets), webpki-root-certs, whisper-rs and whisper-rs-sys were
# all reported `license-exception-not-encountered`, i.e. those licences had
# never actually been checked against the allow list. A second yanked crate
# appeared too. Nothing here was relaxed to make this pass: the allow list and
# the exceptions are byte-for-byte what they were, and `cargo deny check
# advisories licenses bans sources` reports zero errors over all 955.
#
# Guarded by `scripts/check_deny_graph.py`, because setting this back to
# `false` costs 656 crates of coverage and cargo-deny still prints "ok" —
# there is nothing else that would notice.
all-features = true
no-default-features = false

[output]
feature-depth = 1

# ----------------------------------------------------------------
# Advisories
# ----------------------------------------------------------------
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Mirror of the .github/workflows/ci.yml audit job ignore list. Each
# entry must come with: (a) reason it does not apply or cannot be
# fixed today, (b) a `Re-check by:` DATE, and optionally the upstream
# event that would let the entry be deleted instead of renewed.
#
# The date is not optional any more, and that is V401's doing. The rule
# used to read "date OR upstream event", and on 2026-10-13 six of the
# eight dates had passed with one re-check recorded between them — while
# two of the event-only conditions turned out to be impossible to meet
# (one named a crate that does not even pull the dependency). An event
# with no deadline is not a trigger, it is a hope.
#
# A re-check MOVES the date forward; it does not add a note under a date
# that has already passed. `scripts/check_recheck_dates.py` fails CI on
# any date in the past, so the field is always a promise about the future.
# `.github/workflows/rustsec-review-monthly.yml` opens a monthly tracking
# issue with the same list — useful, and NOT a gate: its five issues from
# June to October 2026 are all still open. The runbook
# `docs/runbooks/rustsec-handling.md` is the policy.
ignore = [
    # ---- La familia zstd, cuatro advisories del 2026-10-26 -----------------
    #
    # Contexto comun a las cuatro, y lo que NO se pudo hacer. CI se puso en
    # rojo ese dia con el Cargo.lock sin tocar: el commit anterior habia pasado
    # dos horas antes, y lo unico que cambio fue la base de datos de advisories.
    #
    # ARREGLO UPSTREAM: zstd >=0.14.3, zstd-safe >=8.2.0, zstd-sys >=2.1.2.
    # NO es alcanzable, y esto se PROBO, no se supuso:
    #
    #   $ cargo update -p zstd --precise 0.14.3
    #   error: failed to select a version for the requirement `zstd = "^0.13"`
    #   required by package `lance-encoding v2.0.0`
    #
    # Y subiendo `lancedb` de 0.26 a 0.40 --- catorce versiones menores --- el
    # error es el MISMO: `lance-encoding v13.0.0`, la ultima publicada, sigue
    # pidiendo `zstd = "^0.13"`.
    #
    # Y no es un padre, son LOS CINCO. Leido de sus propios manifiestos en la
    # cache del registro (2026-10-26), sin tocar el arbol:
    #
    #   lance-encoding 2.0.0    zstd = "0.13"
    #   polars-parquet 0.55.2   zstd = "0.13"
    #   polars-arrow   0.55.2   zstd = "0.13"
    #   arrow-ipc      57.3.0   zstd = "0.13.0"
    #   tantivy-sstable 0.5.0   zstd = "0.13"
    #
    # Asi que NO hay arreglo parcial: quitar una feature no baja el major,
    # porque cargo resuelve una sola version de zstd para todo el grafo y
    # cualquiera de los cinco la ancla en 0.13. Tendrian que moverse todos. El
    # salto 7->8 de zstd-safe es rompiente, asi que un `[patch.crates-io]`
    # tampoco compilaria.
    #
    # ALCANCE MEDIDO (2026-10-26, `cargo tree --all-features -e features`): las
    # features de zstd-safe encendidas son arrays, experimental, legacy, std y
    # zdict_builder. `seekable` NO esta. Cada entrada de abajo dice que implica
    # eso para ella.
    #
    # DOS de las cuatro son alcanzables, asi que esto no es «no nos aplica»: es
    # riesgo aceptado con fecha, porque la alternativa es quitar
    # `vector-lancedb` y `tabular-polars`.
    #
    # Re-check by: 2027-01-26 O cuando lance-encoding / polars-parquet suban a
    # zstd 0.14 (lo que ocurra primero) --- entonces BORRAR las cuatro, no
    # renovarlas. Tracked como N169.

    # zstd 0.13.3: datos de un flujo abandonado se filtran al siguiente cuando
    # se reutiliza el contexto de compresion. COMPILADO y en el camino normal:
    # es la unica de las cuatro sin atenuante de alcance. En nuestro uso la
    # fuga seria de nuestros propios datos a nuestros propios datos, dentro del
    # mismo proceso --- lance y polars comprimen columnas que ya son nuestras.
    # Riesgo aceptado; ver el bloque de arriba para por que no se puede subir.
    # Re-check by: 2027-01-26 O cuando upstream suba a zstd 0.14 — BORRAR.
    "RUSTSEC-2026-0391",
    # zstd-safe 7.2.4: `Seekable::decompress` pone la longitud de un `Vec` por
    # encima de su capacidad para offsets pasado el final. NO COMPILADO: la
    # feature `seekable` de zstd-safe no esta encendida (medido 2026-10-26 con
    # `cargo tree --all-features -e features -i zstd-safe`; las encendidas son
    # arrays, experimental, legacy, std, zdict_builder). El codigo vulnerable
    # no entra en el binario.
    # Re-check by: 2027-01-26 O cuando upstream suba a zstd-safe 8.2 — BORRAR.
    "RUSTSEC-2026-0398",
    # zstd-safe 7.2.4: memoria sin inicializar expuesta cuando falla la
    # descompresion EN FLUJO de un frame legacy. COMPILADO --- la feature
    # `legacy` si esta encendida ---, y hace falta un frame en formato anterior
    # a zstd 0.8 **y** que su descompresion falle. Los ficheros que escribe
    # esta pila no son legacy, asi que el camino requiere leer un fichero ajeno
    # y malformado. Riesgo aceptado con esa condicion escrita.
    # Re-check by: 2027-01-26 O cuando upstream suba a zstd-safe 8.2 — BORRAR.
    "RUSTSEC-2026-0403",
    # zstd-sys 2.0.16: el shim del asignador de WebAssembly corrompe memoria al
    # fallar una asignacion. No toca nuestros objetivos: `wasm32` no aparece ni
    # una vez en `.github/workflows/ci.yml` (medido 2026-10-26), y el shim solo
    # se compila para objetivos wasm. OJO: un consumidor que compile esta
    # libreria a wasm32 CON `vector-lancedb` o `tabular-polars` SI estaria
    # afectado --- eso no lo arregla esta entrada, lo documenta.
    # Re-check by: 2027-01-26 O cuando upstream suba a zstd-sys 2.1.2 — BORRAR.
    "RUSTSEC-2026-0410",
    # webbrowser 0.8.15: on Unix, a hostile `BROWSER` environment variable can
    # inject arguments into the spawned browser command. Fixed upstream in
    # 1.2.2, which we cannot reach: the crate is transitive via
    # egui-winit 0.27.2, and that pins `^0.8`. Reaching 1.x means upgrading the
    # whole egui stack (0.27 is several breaking releases behind), which is a
    # piece of work, not a lock bump. Unix-only, and it needs an attacker who
    # already controls the process environment; the egui features are not in
    # `full`. Same blocker as RUSTSEC-2026-0192 below.
    # Re-check by: 2027-03-15 OR when the egui stack is upgraded past 0.27
    # (tracked as N37) — then DELETE this entry, do not renew it.
    #
    # V401 re-check (2026-10-13): measured, and this is the ONE entry whose
    # written reason survived contact with the graph unchanged. `cargo tree
    # --all-features -i webbrowser` gives exactly one dependant,
    # egui-winit 0.27.2, requiring `^0.8.3`; the lock still has 0.8.15 and the
    # fix is 1.2.2. Renewed. It also gained the date it did not have: the
    # condition was correct and still unfalsifiable on its own schedule.
    "RUSTSEC-2026-0257",
    # RUSTSEC-2026-0222 (wasmtime) was here. It said to DELETE the entry rather
    # than renew it once the toolchain moved, and V276 moved it: Rust 1.98 and
    # wasmtime 46, so the advisory is fixed rather than ignored. Left as a note
    # because "the ignore list got shorter" is the outcome this policy exists
    # to produce, and it is worth being able to see it happened.
    # bincode 1.x unmaintained. We use it for snapshot serialization
    # and a 2.x migration is non-trivial (positional schema, breaking
    # for on-disk caches).
    # Re-check by: 2026-08-01 OR when bincode 2.x ships a 1.x-compat
    # serde shim.
    #
    # V401 re-check (2026-10-13): still 1.3.3 and the migration is still ours
    # to do, but the framing above hid the part that matters. The lock carries
    # BOTH versions: 1.3.3 declared by us (`bincode = { version = "1" }`, and
    # `cargo tree -i bincode@1.3.3` shows ai_assistant as the only dependant)
    # and 2.0.1 pulled by polars-utils. So 2.x is already compiled in any build
    # with `tabular-polars`, and the advisory is on the copy that is ours alone.
    # Nothing upstream blocks this: the re-check condition as written ("when
    # bincode 2.x ships a 1.x-compat serde shim") describes a convenience we are
    # waiting for, not a dependency we are stuck behind. Renewed because the
    # on-disk format break is real, not because we cannot move.
    # Re-check by: 2027-01-15
    "RUSTSEC-2025-0141",
    # paste unmaintained. Pulled in transitively by macro-heavy crates.
    # Source code is small and audited; replacement crate `paste-rs` not yet
    # adopted upstream.
    # Re-check by: 2026-08-01 OR when egui drops the `paste` dep.
    #
    # V401 re-check (2026-10-13): the reason was right about the shape and
    # WRONG about the cause, and the old re-check condition could never fire.
    # It said "egui, several proc-macro deps" and keyed the review on egui
    # dropping it. Measured with `cargo tree --all-features -i paste`: 22
    # dependants, and **egui is not one of them**. The real ones are datafusion
    # (eight crates), the gemm family (seven), lance-bitpacking, tokenizers
    # (0.22 and 0.23), nokhwa, pulp, random_word and macro_rules_attribute.
    # Upgrading egui — the work tracked as N37 — would not remove a single one.
    # Renewed on a date, with no upstream condition at all: with 22 independent
    # dependants there is no one event to wait for, and pretending otherwise is
    # what produced a trigger nobody could ever pull.
    # Re-check by: 2027-02-15
    "RUSTSEC-2024-0436",
    # rustls-pemfile unmaintained warning. Our code uses rustls-pki-types
    # directly where the API moved.
    # Re-check by: 2026-08-01 OR when reqwest publishes a version that
    # drops the rustls-pemfile dep.
    #
    # V401 re-check (2026-10-13): the old reason was false in both halves. It
    # said rustls-pemfile is "only present transitively via reqwest's TLS
    # backend". Measured with `cargo tree --all-features -i rustls-pemfile`:
    # two dependants, **ai_assistant itself** — we declare it, `rustls-pemfile
    # = { version = "2", optional = true }`, for PEM loading under
    # `server-tls` — and bollard. reqwest is not in the chain at all. So it is
    # not transitive-only, and waiting for reqwest to drop it would have waited
    # forever on a crate that never had it.
    # Still an `unmaintained` warning rather than a vulnerability, and 2.2.0 is
    # the latest release; the honest statement is that there is nowhere to
    # upgrade to, not that somebody else is holding us back.
    # Re-check by: 2027-01-15
    "RUSTSEC-2025-0134",
    # lru 0.12.5 unsound IterMut (Stacked Borrows violation). Purely
    # transitive: tantivy -> lance/lancedb; no direct lru usage in this
    # crate (verified by grep, V153 audit). The unsoundness requires
    # calling IterMut in a specific pattern inside tantivy's internals;
    # not reachable from our API surface.
    # Re-check by: 2026-09-01 OR when lancedb/tantivy bump lru >= 0.16.
    #
    # V385 re-check (2026-10-10): the DATE has passed, the UPSTREAM condition
    # has not. Still lru 0.12.5, via tantivy 0.24.2 -> lance 2.0.0 / lancedb
    # 0.26.2; the advisory is patched in >= 0.16.3, so we are still affected.
    # Renewed, not deleted.
    #
    # And a measured oddity, written down because the alternative is a comment
    # that quietly means something else than it says: cargo-deny does NOT
    # report this advisory even over the full feature graph. Not because the
    # crate is absent — `cargo deny --all-features list` shows lru@0.12.5 —
    # and not because the suppression is doing the work: deleting this line
    # and re-running still prints `advisories ok`. It is the only entry here
    # with `informational = "unsound"`, which is the obvious suspect, but that
    # is a guess and it is not verified, so it is not stated as the cause.
    # What IS established: this entry is load-bearing for cargo-audit (which
    # reads the whole lock and does see it) and inert for cargo-deny. Do not
    # remove it on the strength of cargo-deny's `advisory-not-detected`.
    #
    # V401 re-check (2026-10-13): the measurement above still holds, and V385
    # made a procedural mistake worth naming — it recorded the re-check and
    # left `Re-check by: 2026-09-01` in place, so the entry stayed permanently
    # overdue while reading as freshly reviewed. That is what the new gate
    # fails on. A re-check moves the date.
    # Also new since V385: a SECOND lru advisory, RUSTSEC-2026-0253 (potential
    # use-after-free from missing panic safety in `LruCache::pop()`), is now in
    # the database for 0.12.5. It is NOT in this list and does not need to be:
    # cargo-audit classes it `unsound`, which it only warns about, and
    # cargo-deny does not report it. Noted so the next reader is not surprised
    # by a second id on the same crate.
    # Re-check by: 2027-02-15
    "RUSTSEC-2026-0002",
    # (RUSTSEC-2026-0187 was here -- lopdf stack overflow. DELETED in V355,
    #  not renewed: its own re-check condition had come true. pdf-extract
    #  0.12.1 depends on lopdf ^0.42, so 0.7 -> 0.12 fixed it at the source.
    #  The note said "no pdf-extract release uses lopdf >= 0.42 yet", which had
    #  stopped being true -- and a suppression whose written reason is false
    #  looks reviewed, so nobody re-reads it.)
    # quick-xml quadratic run time when checking a start tag for duplicate
    # attribute names. Still a DoS, still transitive, still unreachable from a
    # lock bump — and the reason this entry used to give was wrong about
    # everything load-bearing.
    #
    # V401 re-check (2026-10-13). What the old note claimed: "purely transitive
    # via wayland-scanner (the Linux GUI file-dialog chain rfd -> ashpd ->
    # wayland-client -> wayland-scanner)" and "the only consumer parses trusted,
    # build-time wayland protocol XML, so the DoS is not reachable from crate
    # input". What `cargo tree -e features -i quick-xml` actually says, with
    # ONLY `--features tabular-polars` and no GUI feature in sight:
    #
    #     quick-xml 0.39.4
    #       object_store 0.13.2   (features "cloud" and "http" ENABLED)
    #         polars-io feature "cloud" <- "file_cache" <- polars-stream
    #           polars-lazy <- polars <- ai_assistant (feature "csv")
    #
    # So the crate is in the build because of OUR OWN `tabular-polars`, through
    # the cloud object-store client, whose XML comes off the network from
    # whatever S3-compatible endpoint it is pointed at — not from a build-time
    # protocol file. wayland-scanner does declare `^0.39` too, but it is not
    # what puts 0.39.4 in the graph, and the entire trust argument rested on it.
    #
    # Reachability, stated honestly rather than dismissed: `pl_path` in
    # src/tabular/polars_engine.rs hands polars a `&Path` as a plain string and
    # does not distinguish local paths from cloud URLs, so a caller that passes
    # `s3://...` or `https://...` does reach this code. It needs the caller to
    # aim the tabular engine at a hostile or compromised object store, and the
    # worst case is CPU burn in that call. Lower severity than it first looks,
    # higher than "not reachable from crate input".
    # The fix is quick-xml >= 0.41 and object_store 0.13.2 pins `^0.39`; 0.13.2
    # is already the newest release (`cargo update --dry-run` moves nothing), so
    # there is no lock bump available. Renewed on a SHORT leash because this is
    # the one entry whose reachability is a real question.
    # Re-check by: 2026-12-15 OR when object_store ships a release on
    # quick-xml >= 0.41 and polars picks it up.
    "RUSTSEC-2026-0194",
    # quick-xml, same crate and version, second DoS: unbounded namespace-
    # declaration allocation in NsReader. Same chain, same reachability, same
    # blocker as RUSTSEC-2026-0194 above — see that entry for the measurement.
    # It had NO trigger line of its own, which is how it survived every review:
    # "same transitive constraint" inherits a reason but not a deadline.
    # Re-check by: 2026-12-15 OR when object_store ships a release on
    # quick-xml >= 0.41 and polars picks it up.
    "RUSTSEC-2026-0195",
    # ttf-parser 0.25.1 unmaintained. cargo-deny denies unmaintained where
    # cargo-audit only warns, which is why this is here at all.
    # Re-check by: 2026-10-01 OR when egui drops ttf-parser.
    #
    # V401 re-check (2026-10-13): still 0.25.1, and the old re-check condition
    # could never have cleared it. It read "when egui drops ttf-parser", naming
    # one root; `cargo tree --all-features -i ttf-parser` shows TWO independent
    # ones:
    #
    #     ttf-parser 0.25.1
    #       lopdf 0.42.0 <- pdf-extract 0.12.1 <- ai_assistant
    #       owned_ttf_parser 0.25.1 <- ab_glyph <- epaint <- egui <- ai_assistant
    #
    # The second is the egui path the note described. The first is the PDF text
    # extraction path, which has nothing to do with the GUI and would keep the
    # crate even after N37 upgrades egui past 0.27. A condition that cannot
    # come true is worse than no condition: it reads as a plan.
    # Renewed with both roots written down, so whoever does N37 is not misled
    # into expecting this entry to disappear with it.
    # Re-check by: 2027-03-15 OR when BOTH lopdf and the egui stack drop it,
    # or ttf-parser gets a maintainer again.
    "RUSTSEC-2026-0192",
    # --- las tres de `zip` (2026-10-09/10). Medicion comun, hecha el 2026-10-20
    # leyendo los usos y no suponiendolos:
    #
    #   Nosotros usamos `ZipArchive::new` (6 sitios), `ZipWriter::new`,
    #   `FileOptions` y `CompressionMethod::Deflated`: leemos entradas y
    #   escribimos archivos. NO hay una sola llamada a `.extract()` sobre un zip
    #   en `src/` -- los cinco `.extract(` que aparecen son
    #   `extractor.extract(...)` del extractor de hechos de `advanced_memory`.
    #
    #   La copia transitiva igual: `candle-core 0.10.2` arrastra `zip 7.2.0` y
    #   usa `ZipArchive::new` (7 sitios), `ZipWriter::new` y `FileOptions`.
    #   Comprobado en el fuente de la cache del registro, porque afirmar que un
    #   tercero no llama a una funcion sin mirarlo es una razon falsa con
    #   aspecto de revisada.
    #
    #   Tres versiones en el lock: 2.4.2 (la nuestra, declarada), 3.0.0 (sin
    #   arista normal) y 7.2.0 (por candle). El arreglo esta en >= 9.0.0: siete
    #   versiones mayores de salto para la nuestra, y fuera de nuestra mano para
    #   la de candle. Subir la nuestra es deuda legitima aparte (N153).
    #
    #   Cada una lleva su propia razon y su propia fecha abajo, porque es lo que
    #   piden `check_rustsec_ignores.py` y `check_recheck_dates.py` -- y tenian
    #   razon: un comentario compartido para tres entradas deja dos sin razon
    #   propia, y una entrada sin razon es la que nadie vuelve a leer.

    # zip: conserva los bits SUID/SGID al EXTRAER. No extraemos (ver medicion
    # arriba): solo `ZipArchive::new` para leer y `ZipWriter::new` para escribir.
    # Re-check by: 2026-12-15 OR cuando subamos nuestro `zip` a >= 9 (N153).
    "RUSTSEC-2026-0367",
    # zip: `ZipArchive::extract` crea symlinks que apuntan donde diga el archivo.
    # La funcion vulnerable es `extract`, y no la llamamos -- ni nosotros ni
    # candle-core, el unico otro dependiente (ver medicion arriba).
    # Re-check by: 2026-12-15 OR cuando subamos nuestro `zip` a >= 9 (N153).
    "RUSTSEC-2026-0368",
    # zip: `ZipStreamReader::extract()` y `ZipArchive::extract()` aplican los
    # permisos Unix que vengan en el archivo. Las dos son de extraccion y
    # ninguna aparece en el grafo (ver medicion arriba); `ZipStreamReader` no se
    # menciona siquiera.
    # Re-check by: 2026-12-15 OR cuando subamos nuestro `zip` a >= 9 (N153).
    "RUSTSEC-2026-0369",
]

# ----------------------------------------------------------------
# Licenses — PolyForm Noncommercial means we cannot ship copyleft.
# ----------------------------------------------------------------
[licenses]
# 0.90 lets cargo-deny match our LICENSE file (PolyForm-Noncommercial-1.0.0
# scores 0.90 because it's not in the standard SPDX corpus). The
# [[licenses.clarify]] entry below pins the match so this threshold
# only relaxes detection on the workspace crate itself, not transitives.
confidence-threshold = 0.90
# Permissive licenses we accept in dependencies.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",        # weak copyleft, file-level — acceptable for libraries
    "OpenSSL",
    "BSL-1.0",
    "WTFPL",
    # Our own license, recognised via [[licenses.clarify]] below.
    "LicenseRef-PolyForm-Noncommercial-1.0.0",
]
# Per-crate license exceptions. Scoped narrowly so a *new* transitive
# carrying any of these licenses still fails the gate and forces an
# audit. Reviewed at every dependency bump.
exceptions = [
    # egui font assets ship under SIL Open Font License + Ubuntu Font License.
    # We do not redistribute the embedded fonts as separate artifacts; they
    # travel with epaint as part of the GUI surface, which is acceptable
    # under both licenses (OFL allows bundling, UFL is permissive).
    { name = "epaint", version = "*", allow = ["OFL-1.1", "LicenseRef-UFL-1.0"] },
    # webpki root certificate bundle is published by Mozilla under the
    # Community Data License Agreement — Permissive 2.0 because it's
    # certificate *data*, not code. Acceptable in a non-commercial library.
    { name = "webpki-root-certs", version = "*", allow = ["CDLA-Permissive-2.0"] },
    { name = "webpki-roots", version = "*", allow = ["CDLA-Permissive-2.0"] },
    # whisper.cpp Rust bindings are dedicated to the public domain via
    # the Unlicense. Equivalent to CC0 — acceptable.
    { name = "whisper-rs", version = "*", allow = ["Unlicense"] },
    { name = "whisper-rs-sys", version = "*", allow = ["Unlicense"] },
]

# Pin the detection of our own LICENSE file. The hash matches the
# PolyForm Noncommercial 1.0.0 text shipped at the repo root; if the
# LICENSE file is ever modified, this hash will need to be regenerated
# (cargo-deny prints the new hash in the warning output).
[[licenses.clarify]]
name = "ai_assistant"
version = "*"
expression = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = [
    { path = "LICENSE", hash = 0x516ff7a6 },
]


# ----------------------------------------------------------------
# Bans — keep the dep graph clean.
# ----------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Crates we never want pulled in, even transitively. Empty for now;
# add entries as supply-chain incidents surface.
deny = []
# Skip duplicate-detection on noisy multi-version offenders that come
# from incompatible upstream pins. Reviewed quarterly.
skip = []
skip-tree = []

# ----------------------------------------------------------------
# Sources — only crates.io and our own git remote.
# ----------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
