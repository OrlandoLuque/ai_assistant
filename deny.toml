    # que «fuera de nuestra mano» era una frase sobre el padre, no sobre upstream.
    #
    # Y el dia de borrarlas llegan CUATRO advisories nuevos de `zip`
    # (RUSTSEC-2026-0545 a -0548, del 2026-11-17: AES sin comprobar su codigo de
    # autenticacion, symlinks fuera del destino, preasignacion en los
    # decodificadores heredados y nombres del encabezado local), con el mismo
    # arreglo `>= 9.0.0`. **No entran aqui: ya estan arreglados.** Si la subida
    # se hubiera dejado para el 2026-12-15, esta lista tendria hoy ocho
    # entradas de `zip` en vez de ninguna.
    #
    # El lock, de paso, pierde 90 lineas netas: fuera `onig`, `onig_sys`,
    # `rust-embed` (x3) y `derive_arbitrary`; dentro `fancy-regex`.

    # ---- Tres `unmaintained` nuevos (2026-11-17), sin version arreglada ----
    #
    # Los tres los declara cargo-audit con «No fixed upgrade is available!», y
    # son avisos de MANTENIMIENTO, no vulnerabilidades: no hay camino de
    # explotacion que evaluar, hay un crate que ya no tiene quien lo cuide.
    # Por eso la fecha va a tres meses y no a uno: lo que hay que volver a
    # mirar es si el ecosistema se movio, y eso no pasa en cuatro semanas.
    # Ponerlos en el monton del 2026-12-15 habria hecho de ese dia nueve
    # entradas, que es como una fecha deja de ser un disparador.

    # chrono: lo usamos DIRECTAMENTE --- 63 ficheros de `src/` lo mencionan y
    # `Cargo.toml` lo declara sin `optional` --- y ademas lo arrastran por su
    # cuenta arrow 57.3, datafusion 51.0 y polars 0.55. Cambiar de crate no es
    # un bump de lock: es una migracion de ecosistema que no depende solo de
    # nosotros. Medido el 2026-11-18.
    # Re-check by: 2027-02-15 OR cuando arrow/datafusion/polars migren.
    "RUSTSEC-2026-0543",
    # chrono-tz: transitivo y SOLO transitivo --- polars 0.55 (arrow, core, ops,
    # plan, stream, time) y arrow-array 57.3. Medido: CERO apariciones de
    # `chrono_tz` en `src/`, asi que no hay nada nuestro que migrar; se va solo
    # cuando se vayan polars y arrow.
    # Re-check by: 2027-02-15 OR cuando polars y arrow lo suelten.
    "RUSTSEC-2026-0555",
    # humantime: transitivo y solo transitivo --- lance 2.0.0 y object_store
    # (0.12.5 y 0.13.2). Medido: CERO apariciones en `src/`. Formatea
    # duraciones; no hay superficie que evaluar mas alla de eso.
    # Re-check by: 2027-02-15 OR cuando lance y object_store lo suelten.
    "RUSTSEC-2026-0542",
    # unsafe-libyaml: `unmaintained`, y cargo-audit lo dice con «No fixed upgrade
    # is available!» porque el rango afectado es `introduced: 0.0.0-0` sin
    # version arreglada. No hay a donde subir en ningun eslabon.
    #
    # La cadena, medida en el lock de hoy:
    #   lancedb 0.41.0 -> lance-index 14.0.2 -> lance-tokenizer 14.0.2
    #                  -> lindera 3.0.7 -> serde_yaml_ng 0.10.0
    #                  -> unsafe-libyaml 0.2.11
    #
    # POR QUE NO SE PUEDE SALIR SUBIENDO, re-medido en crates.io el 2026-11-21 y
    # no heredado de la nota anterior, que era FALSA en este punto:
    #   1. `lindera` YA solto `serde_yaml_ng`, en **5.0.0** (2026-08-08), y va por
    #      6.2.0. Asi que «esperar a lindera» no es la condicion: lindera ya esta.
    #   2. `lance-tokenizer` 14.0.3 (2026-11-15), su ultima publicada, sigue
    #      pidiendo `lindera ^3.0.7`. Tres meses despues.
    #   3. Y hay un segundo clavo que la nota anterior no tenia: `lancedb` 0.41.0
    #      pide `lance-index =14.0.2` EXACTO, con
    #      `features = ["tokenizer-jieba", "tokenizer-lindera"]` y sin `optional`.
    #      O sea que aunque lance-tokenizer arreglara el suyo manana, no llegaria
    #      aqui hasta que lancedb suba. Son DOS clavos, no uno.
    #
    # Superficie: CERO apariciones de `serde_yaml_ng::` o `unsafe_libyaml::` en
    # `src/`. Es el parser de YAML con el que lindera lee su configuracion de
    # diccionarios, detras de la feature opcional `vector-lancedb`, que no entra
    # ni en `full` ni en `FEATURES_STD`.
    #
    # Lo que esta entrada cuesta, dicho claro: V475 cambio NUEVE avisos `unsound`
    # de `heapless` 0.8 ---con parche en 0.9.4 y a seis niveles, inalcanzable---
    # por este uno de mantenimiento sin parche. El cambio es bueno y la deuda es
    # mas pequena, pero sigue siendo deuda, y el autor la ha puesto como lo
    # PRIORITARIO siguiente: el arreglo de verdad es que lance suelte el pin.
    # Re-check by: 2027-02-21 OR cuando `lance-tokenizer` admita lindera 5+ Y
    # `lancedb` suba de `lance-index =14.0.2`. Las dos se comprueban con una
    # llamada a crates.io cada una.
    "RUSTSEC-2024-0449",
]

# ----------------------------------------------------------------
# Licenses — PolyForm Noncommercial means we cannot ship copyleft.
# ----------------------------------------------------------------
[licenses]
# 0.90 lets cargo-deny match our LICENSE file (PolyForm-Noncommercial-1.0.0
# scores 0.90 because it's not in the standard SPDX corpus). The
# [[licenses.clarify]] entry below pins the match so this threshold
# only relaxes detection on the workspace crate itself, not transitives.
confidence-threshold = 0.90
# Permissive licenses we accept in dependencies.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",        # weak copyleft, file-level — acceptable for libraries
    "OpenSSL",
    "BSL-1.0",
    "WTFPL",
    # Our own license, recognised via [[licenses.clarify]] below.
    "LicenseRef-PolyForm-Noncommercial-1.0.0",
]
# Per-crate license exceptions. Scoped narrowly so a *new* transitive
# carrying any of these licenses still fails the gate and forces an
# audit. Reviewed at every dependency bump.
exceptions = [
    # egui font assets ship under SIL Open Font License + Ubuntu Font License.
    # We do not redistribute the embedded fonts as separate artifacts; they
    # travel with epaint as part of the GUI surface, which is acceptable
    # under both licenses (OFL allows bundling, UFL is permissive).
    { name = "epaint", version = "*", allow = ["OFL-1.1", "LicenseRef-UFL-1.0"] },
    # webpki root certificate bundle is published by Mozilla under the
    # Community Data License Agreement — Permissive 2.0 because it's
    # certificate *data*, not code. Acceptable in a non-commercial library.
    { name = "webpki-root-certs", version = "*", allow = ["CDLA-Permissive-2.0"] },
    { name = "webpki-roots", version = "*", allow = ["CDLA-Permissive-2.0"] },
    # whisper.cpp Rust bindings are dedicated to the public domain via
    # the Unlicense. Equivalent to CC0 — acceptable.
    { name = "whisper-rs", version = "*", allow = ["Unlicense"] },
    { name = "whisper-rs-sys", version = "*", allow = ["Unlicense"] },
]

# Pin the detection of our own LICENSE file. The hash matches the
# PolyForm Noncommercial 1.0.0 text shipped at the repo root; if the
# LICENSE file is ever modified, this hash will need to be regenerated
# (cargo-deny prints the new hash in the warning output).
[[licenses.clarify]]
name = "ai_assistant"
version = "*"
expression = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = [
    { path = "LICENSE", hash = 0x516ff7a6 },
]


# ----------------------------------------------------------------
# Bans — keep the dep graph clean.
# ----------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Crates we never want pulled in, even transitively. Empty for now;
# add entries as supply-chain incidents surface.
deny = []
# Skip duplicate-detection on noisy multi-version offenders that come
# from incompatible upstream pins. Reviewed quarterly.
skip = []
skip-tree = []

# ----------------------------------------------------------------
# Sources — only crates.io and our own git remote.
# ----------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
