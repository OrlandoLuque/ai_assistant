# cargo-deny configuration — V125 (C.1 supply chain)
#
# Three concerns:
#   * advisories — RustSec security database (cargo-audit overlap, but
#     cargo-deny applies the same rules to the full lock graph in one
#     pass, and supports more granular allow/deny lists).
#   * licenses   — block GPL family + AGPL + SSPL (PolyForm
#     Noncommercial 1.0.0 is incompatible with copyleft, so a single
#     GPL transitive contaminates a future commercial dual-license).
#   * bans       — keep the dep graph clean: no duplicates above
#     tolerance, no wildcard versions, no specific known-bad crates.

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ----------------------------------------------------------------
# Advisories
# ----------------------------------------------------------------
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Mirror of the .github/workflows/ci.yml audit job ignore list. Each
# entry must come with a comment explaining *why* — these are reviewed
# at every dependency bump.
ignore = [
    # bincode 1.x is unmaintained; we use it for snapshot serialization
    # and a 2.x migration is non-trivial (positional schema). Tracked
    # separately.
    "RUSTSEC-2025-0141",
    # paste is unmaintained; only used transitively by macro-heavy
    # deps that have not yet migrated.
    "RUSTSEC-2024-0436",
    # rustls-pemfile unmaintained warning; we use rustls-pki-types
    # directly where the API has moved.
    "RUSTSEC-2025-0134",
    # tantivy → lru IterMut unsoundness; our query path doesn't trip
    # the affected codepath.
    "RUSTSEC-2026-0002",
]

# ----------------------------------------------------------------
# Licenses — PolyForm Noncommercial means we cannot ship copyleft.
# ----------------------------------------------------------------
[licenses]
confidence-threshold = 0.93
# Permissive licenses we accept in dependencies.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",        # weak copyleft, file-level — acceptable for libraries
    "OpenSSL",
    "BSL-1.0",
    "WTFPL",
]
# Explicit refusals so a future bump can't silently pull in a copyleft
# transitive. cargo-deny treats anything not in `allow` as a denial,
# but listing these makes the intent explicit in code review.
exceptions = []

# ----------------------------------------------------------------
# Bans — keep the dep graph clean.
# ----------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Crates we never want pulled in, even transitively. Empty for now;
# add entries as supply-chain incidents surface.
deny = []
# Skip duplicate-detection on noisy multi-version offenders that come
# from incompatible upstream pins. Reviewed quarterly.
skip = []
skip-tree = []

# ----------------------------------------------------------------
# Sources — only crates.io and our own git remote.
# ----------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
