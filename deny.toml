# cargo-deny configuration — V125 (C.1 supply chain)
#
# Three concerns:
#   * advisories — RustSec security database (cargo-audit overlap, but
#     cargo-deny applies the same rules to the full lock graph in one
#     pass, and supports more granular allow/deny lists).
#   * licenses   — block GPL family + AGPL + SSPL (PolyForm
#     Noncommercial 1.0.0 is incompatible with copyleft, so a single
#     GPL transitive contaminates a future commercial dual-license).
#   * bans       — keep the dep graph clean: no duplicates above
#     tolerance, no wildcard versions, no specific known-bad crates.

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ----------------------------------------------------------------
# Advisories
# ----------------------------------------------------------------
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Mirror of the .github/workflows/ci.yml audit job ignore list. Each
# entry must come with: (a) reason it does not apply or cannot be
# fixed today, (b) a re-check trigger (date OR upstream event). The
# monthly workflow `.github/workflows/rustsec-review-monthly.yml`
# verifies these are still relevant; the runbook
# `docs/runbooks/rustsec-handling.md` is the policy.
ignore = [
    # bincode 1.x unmaintained. We use it for snapshot serialization
    # and a 2.x migration is non-trivial (positional schema, breaking
    # for on-disk caches).
    # Re-check by: 2026-08-01 OR when bincode 2.x ships a 1.x-compat
    # serde shim.
    "RUSTSEC-2025-0141",
    # paste unmaintained. Pulled in transitively by macro-heavy crates
    # (egui, several proc-macro deps). Source code is small and
    # audited; replacement crate `paste-rs` not yet adopted upstream.
    # Re-check by: 2026-08-01 OR when egui drops the `paste` dep.
    "RUSTSEC-2024-0436",
    # rustls-pemfile unmaintained warning. Our code uses
    # rustls-pki-types directly where the API moved; rustls-pemfile is
    # only present transitively via reqwest's TLS backend.
    # Re-check by: 2026-08-01 OR when reqwest publishes a version that
    # drops the rustls-pemfile dep.
    "RUSTSEC-2025-0134",
]

# ----------------------------------------------------------------
# Licenses — PolyForm Noncommercial means we cannot ship copyleft.
# ----------------------------------------------------------------
[licenses]
# 0.90 lets cargo-deny match our LICENSE file (PolyForm-Noncommercial-1.0.0
# scores 0.90 because it's not in the standard SPDX corpus). The
# [[licenses.clarify]] entry below pins the match so this threshold
# only relaxes detection on the workspace crate itself, not transitives.
confidence-threshold = 0.90
# Permissive licenses we accept in dependencies.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",        # weak copyleft, file-level — acceptable for libraries
    "OpenSSL",
    "BSL-1.0",
    "WTFPL",
    # Our own license, recognised via [[licenses.clarify]] below.
    "LicenseRef-PolyForm-Noncommercial-1.0.0",
]
# Per-crate license exceptions. Scoped narrowly so a *new* transitive
# carrying any of these licenses still fails the gate and forces an
# audit. Reviewed at every dependency bump.
exceptions = [
    # egui font assets ship under SIL Open Font License + Ubuntu Font License.
    # We do not redistribute the embedded fonts as separate artifacts; they
    # travel with epaint as part of the GUI surface, which is acceptable
    # under both licenses (OFL allows bundling, UFL is permissive).
    { name = "epaint", version = "*", allow = ["OFL-1.1", "LicenseRef-UFL-1.0"] },
    # webpki root certificate bundle is published by Mozilla under the
    # Community Data License Agreement — Permissive 2.0 because it's
    # certificate *data*, not code. Acceptable in a non-commercial library.
    { name = "webpki-root-certs", version = "*", allow = ["CDLA-Permissive-2.0"] },
    { name = "webpki-roots", version = "*", allow = ["CDLA-Permissive-2.0"] },
    # whisper.cpp Rust bindings are dedicated to the public domain via
    # the Unlicense. Equivalent to CC0 — acceptable.
    { name = "whisper-rs", version = "*", allow = ["Unlicense"] },
    { name = "whisper-rs-sys", version = "*", allow = ["Unlicense"] },
]

# Pin the detection of our own LICENSE file. The hash matches the
# PolyForm Noncommercial 1.0.0 text shipped at the repo root; if the
# LICENSE file is ever modified, this hash will need to be regenerated
# (cargo-deny prints the new hash in the warning output).
[[licenses.clarify]]
name = "ai_assistant"
version = "*"
expression = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = [
    { path = "LICENSE", hash = 0x516ff7a6 },
]


# ----------------------------------------------------------------
# Bans — keep the dep graph clean.
# ----------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Crates we never want pulled in, even transitively. Empty for now;
# add entries as supply-chain incidents surface.
deny = []
# Skip duplicate-detection on noisy multi-version offenders that come
# from incompatible upstream pins. Reviewed quarterly.
skip = []
skip-tree = []

# ----------------------------------------------------------------
# Sources — only crates.io and our own git remote.
# ----------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
